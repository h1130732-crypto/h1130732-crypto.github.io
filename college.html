function mjGallery(s){
  const g = $("#mjGal"), ph = s.photos || [];
  if (s.type !== "conf" && !ph.length){ g.innerHTML = ""; g.className = "mj-gal none"; return; }
  if (!ph.length){ g.className = "mj-gal empty"; g.innerHTML = `<div class="mj-ph-empty"><b>Photos</b><span>coming soon</span></div>`; return; }
  const shown = ph.slice(0, 4), more = ph.length - shown.length;
  g.className = `mj-gal n${shown.length}`;
  g.innerHTML = `<div class="mj-gal-h"><b>Photos</b><span>${ph.length}</span></div><div class="mj-gal-grid">${shown.map((src, k) =>
    `<button class="mj-ph" data-k="${k}"><img class="bgb" src="${src}" alt="" aria-hidden="true"><img class="fg" src="${src}" alt="${s.conf || s.title} photo ${k + 1}" loading="lazy">${k === 3 && more > 0 ? `<em>+${more}</em>` : ""}</button>`).join("")}</div>`;
  g.querySelectorAll(".mj-ph").forEach(b => b.addEventListener("click", () => mjLightbox(ph, +b.dataset.k, s.conf || s.title)));
}
function mjLightbox(ph, k, title){
  let lb = $("#mjLb");
  if (!lb){
    lb = document.createElement("div"); lb.id = "mjLb"; lb.className = "mj-lb";
    lb.innerHTML = `<button class="mj-lb-x" aria-label="Close photos">${ICON_HOME}</button><button class="mj-lb-nav prev" aria-label="Previous photo">←</button><figure><img alt=""><figcaption></figcaption></figure><button class="mj-lb-nav next" aria-label="Next photo">→</button>`;
    $("#munApp").append(lb);
    lb.querySelector(".mj-lb-x").addEventListener("click", () => lb.hidden = true);
    lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });
  }
  const show = () => { lb.querySelector("img").src = ph[k]; lb.querySelector("figcaption").textContent = `${title} · ${k + 1} / ${ph.length}`;
    lb.querySelectorAll(".mj-lb-nav").forEach(b => b.hidden = ph.length < 2); };
  lb.querySelector(".prev").onclick = () => { k = (k - 1 + ph.length) % ph.length; show(); };
  lb.querySelector(".next").onclick = () => { k = (k + 1) % ph.length; show(); };
  show(); lb.hidden = false;
}
function closeMun(){ hideApp($("#munApp")); appOpen = null; presenter.classList.remove("away"); layout(); advanceIf("mun"); }
addEventListener("keydown", e => {
  if (appOpen !== "mun" || !MJ.started) return;
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); if (MJ.i < MJ_N - 1) mjGo(MJ.i + 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); if (MJ.i > 0) mjGo(MJ.i - 1); }
});

    <g><path d="M330 600 l40 -32 l40 32z" fill="#c4643f"/><rect x="338" y="600" width="64" height="44" fill="#f5efe3"/><path d="M352 583 l18 -14 l18 14z" fill="#2d4f86"/><rect x="362" y="618" width="16" height="26" fill="#8a5a3c"/></g>
    <g><path d="M440 610 l32 -26 l32 26z" fill="#7a8f5a"/><rect x="446" y="610" width="52" height="34" fill="#f5efe3"/><path d="M456 597 l16 -12 l16 12z" fill="#2d4f86"/></g>
    ${[600, 760].map(x => `<g><rect x="${x}" y="612" width="22" height="48" rx="4" fill="#2e7d4f"/><rect x="${x+4}" y="618" width="14" height="12" rx="2" fill="#bff3cf"/><path d="M${x+22} 640 q20 10 30 32" stroke="#26292e" stroke-width="3" fill="none"/></g>`).join("")}
    <g transform="translate(680 690)">${car("#3b82c4", true)}</g>
    <g transform="translate(838 690)">${car("#e2574c", true)}</g>
    <!-- power grid -->
    ${poles.map(x => `<rect x="${x-3}" y="606" width="6" height="94" fill="#7d6a58"/><rect x="${x-16}" y="606" width="32" height="5" fill="#7d6a58"/>`).join("")}
    <path d="${wires}" stroke="#4b5560" stroke-width="2" fill="none"/>
    <path class="ec-flow" d="${wires}" stroke="#ffd23f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="ec-flow back" d="M600 650 V612 M760 650 V612" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- road -->
    <path d="M0 700 H975 C985 720 990 740 995 760 H0Z" fill="#596370"/>
    <path d="M0 729 H985" stroke="#f3f3f3" stroke-width="3" stroke-dasharray="26 22"/>
    <path d="M0 762 H996 C1003 800 1010 850 1020 900 H0Z" fill="#b9d59c"/>
    <path d="M0 762 H996" stroke="#e8e2d0" stroke-width="5"/>
    <g class="ec-car a" transform="translate(0 722)">${car("#f4b740", true)}</g>
    <g class="ec-car b" transform="translate(0 750)">${car("#ffffff", true)}</g>
    <g class="ec-car c" transform="translate(0 722)">${car("#4bb37b", true)}</g>
    <g fill="#5e8f4d">${[60, 200, 330, 470, 900].map(x => `<circle cx="${x}" cy="810" r="20"/><rect x="${x-3}" y="810" width="6" height="26" fill="#7d6a58"/>`).join("")}</g>
    <!-- plane -->
    <g class="ec-plane">
      <path d="M380 205 H690" stroke="url(#ecTrail)" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(735 196)">
        <path d="M-58 4 C-58 -6 -40 -9 -10 -9 H40 C56 -9 64 -3 64 4 C64 9 56 12 40 12 H-46 C-54 12 -58 9 -58 4Z" fill="#fff" stroke="#c6d3de" stroke-width="1.5"/>
        <path d="M-46 -8 L-62 -34 H-48 L-24 -8Z" fill="#2e7d4f"/><path d="M-51 -26 c3 -6 9 -6 10 -2 c-4 1 -7 3 -10 2z" fill="#bff3cf"/>
        <path d="M-8 4 L-30 30 H-16 L18 4Z" fill="#e6edf3" stroke="#c6d3de"/><path d="M-8 -2 L-18 -18 H-8 L10 -2Z" fill="#e6edf3"/>
        <g fill="#5d7f99">${[-34,-24,-14,-4,6,16,26].map(x => `<circle cx="${x}" cy="0" r="2.4"/>`).join("")}</g>
        <path d="M52 -4 q8 2 10 7 h-12z" fill="#5d7f99"/>
      </g>
    </g>
    <!-- hotspots -->
    ${ECO.map(e => { const [x, y] = e.at, label = e.title, w = Math.max(label.length * 9.2, e.place.length * 8.4) + 66, flip = ["trio","coral","ocean24"].includes(e.id);
      return `<g class="ec-hot" data-eco="${e.id}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${label}">
        <circle class="ring" r="20" fill="none" stroke="${e.color}" stroke-width="4"/><circle r="11" fill="${e.color}" stroke="#fff" stroke-width="3"/>
        <g class="lbl" style="--lx:${flip ? -w - 22 : 22}px" transform="translate(${flip ? -w - 22 : 22} -58)"><rect width="${w}" height="44" rx="22" fill="#fff" stroke="${e.color}" stroke-width="2.5"/>
          <circle cx="22" cy="22" r="14" fill="${e.color}"/><text x="22" y="27.5" text-anchor="middle" font-size="15" fill="#fff">${e.icon}</text>
          <text x="44" y="20" font-size="11" font-weight="700" letter-spacing="1.2" fill="${e.color}">${e.place.toUpperCase()}</text>
          <text x="44" y="36" font-size="16" font-weight="700" fill="#1d2530">${label}</text></g></g>`; }).join("")}
  </g></svg>`;
}
function ecPanelHTML(e){
  const i = ECO.indexOf(e), nx = ECO[(i + 1) % ECO.length];
  return `<div class="ec-ph" style="--c:${e.color}"><span>${e.kicker}</span><h2>${e.title}</h2><p>${e.sub}</p></div>
    <div class="ec-pb" style="--c:${e.color}">
      ${e.photos?.length ? `<div class="ec-photos n${Math.min(e.photos.length, 2)}">${e.photos.map(p => `<img src="${p}" alt="${e.title}" loading="lazy">`).join("")}</div>` : ""}
      <dl class="ec-meta"><div><dt>Role</dt><dd>${e.role}</dd></div><div><dt>Where</dt><dd>${e.org}</dd></div></dl>
      <p class="ec-lead">${e.lead}</p>
      ${e.thesis ? `<div class="ec-thesis"><span>${e.id === "v2g" ? "My argument" : "Key idea"}</span>${e.thesis}</div>` : ""}
      ${e.facts ? `<div class="ec-facts">${e.facts.map(([b, t]) => `<div><b>${b}</b><span>${t}</span></div>`).join("")}</div>` : ""}
      ${e.method ? `<h4>${e.id === "saf" ? "How I did it" : "How it works"}</h4><ol class="ec-steps">${e.method.map(m => `<li>${m}</li>`).join("")}</ol>` : ""}
      ${e.chart ? (() => { const mx = Math.max(...e.chart.rows.map(r => r[1])); return `<h4>${e.chart.title}</h4><div class="ec-chart">${e.chart.rows.map(([n, v]) => `<div class="ec-bar"><span>${n}</span><i style="width:${(v / mx * 100).toFixed(1)}%;--h:${v < 20 ? "#2e9d63" : v < 40 ? "#d9a520" : "#d2553f"}"></i><b>${v}</b></div>`).join("")}<small>Source: ${e.chart.source}. Lower is better.</small></div>`; })() : ""}
      ${(e.sections || []).map(([h, items]) => `<h4>${h}</h4><ul class="ec-list">${items.map(t => `<li>${t}</li>`).join("")}</ul>`).join("")}
      ${e.parts ? `<h4>Our solutions</h4><ol class="ec-parts">${e.parts.map(([h, t]) => `<li><b>${h}</b><span>${t}</span></li>`).join("")}</ol>` : ""}
      ${e.paper ? `<h4>Research paper</h4><blockquote class="ec-paper">${e.paper}</blockquote>` : ""}
      <h4>${["trio","coral","ocean24"].includes(e.id) ? "Competitions" : "Recognition"}</h4>
      <ul class="ec-awards">${e.awards.map(([y, t, s]) => `<li><span>${y}</span><div><b>${t}</b>${s ? `<small>${s}</small>` : ""}</div></li>`).join("")}</ul>
      <button class="ec-next" data-eco="${nx.id}" style="--c:${nx.color}">Next: ${nx.title} <span>→</span></button>
    </div>`;
}
function ecFocus(id){
  const st = $("#ecStage"), w = $("#ecWorld"), e = ECO.find(x => x.id === id);
  EC.cur = e ? id : null;
  $("#ecoApp").classList.toggle("open", !!e);
  if (e) $("#ecoApp").classList.toggle("pl", e.at[0] > 1000);
  document.querySelectorAll("#ecoApp [data-eco]").forEach(b => b.classList.toggle("on", b.dataset.eco === id));
  if (!e){ w.style.transform = ""; return; }
  const p = $("#ecPanel"); p.innerHTML = ecPanelHTML(e); p.scrollTop = 0;
  p.querySelector(".ec-next").addEventListener("click", () => ecFocus(p.querySelector(".ec-next").dataset.eco));
  p.querySelectorAll(".ec-photos img").forEach((im, k) => im.addEventListener("click", () => ecPhoto(e, k)));
  const portrait = st.clientHeight > st.clientWidth, k = portrait ? 1.6 : 1.55;
  const cx = portrait ? 830 : (e.at[0] > 1000 ? 1040 : 560), cy = portrait ? 380 : 450;
  const tx = Math.min(0, Math.max(1600 - 1600 * k, cx - k * e.focus[0])), ty = Math.min(0, Math.max(900 - 900 * k, cy - k * e.focus[1]));
  w.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
}
function ecPhoto(e, k){
  let lb = $("#ecLb");
  if (!lb){ lb = document.createElement("div"); lb.id = "ecLb"; lb.className = "ec-lb"; lb.innerHTML = `<img alt="">`; $("#ecoApp").append(lb); lb.addEventListener("click", () => lb.hidden = true); }
  lb.querySelector("img").src = e.photos[k]; lb.hidden = false;
}
function openEco(){
  appOpen = "weather"; presenter.classList.add("away"); layout(); showTip();
  let el = $("#ecoApp");
  if (!el){
    el = document.createElement("div"); el.id = "ecoApp";
    el.innerHTML = `
      <header class="ec-top"><div class="ec-brand"><b>Climate City</b><span>My environmental research · tap a glowing spot</span></div>
        <button class="close-app" id="ecClose">${ICON_HOME}Close</button></header>
      <div class="ec-stage" id="ecStage">${ecSceneSVG()}</div>
      <nav class="ec-links" aria-label="Projects">${ECO.map(e => `<button data-eco="${e.id}" style="--c:${e.color}"><i>${e.icon}</i><span><small>${e.place}</small>${e.title}</span></button>`).join("")}</nav>
      <aside class="ec-panel" id="ecPanel" aria-live="polite"></aside>
      <button class="ec-back" id="ecBack">← Back to the city</button>`;
    document.body.append(el);
    $("#ecClose").addEventListener("click", closeEco);
    $("#ecBack").addEventListener("click", () => ecFocus(null));
    el.querySelectorAll("[data-eco]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); ecFocus(b.dataset.eco); }));
    el.querySelectorAll(".ec-hot").forEach(h => h.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); ecFocus(h.dataset.eco); } }));
    $("#ecStage").addEventListener("click", ev => { if (!ev.target.closest(".ec-hot") && EC.cur) ecFocus(null); });
  }
  el.hidden = false; ecFocus(null);
  const portrait = innerHeight > innerWidth;
  el.querySelector(".ec-svg").setAttribute("preserveAspectRatio", portrait ? "xMidYMid slice" : "xMidYMid slice");
  el.querySelector(".ec-svg").setAttribute("viewBox", portrait ? "180 60 1300 840" : "0 0 1600 900");
}
function closeEco(){ hideApp($("#ecoApp")); appOpen = null; presenter.classList.remove("away"); layout(); advanceIf("weather"); }

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".player")) return closePlayer();
  if (document.querySelector(".modal-wrap")) return closeDetail();
  const sheet = document.querySelector(".sheet-wrap .pill-btn"); if (sheet) return sheet.click();
  if (appOpen === "music") return closeMusic();
  if (appOpen === "files") return closeFiles();
  if (appOpen === "mun") return closeMun();
  if (appOpen === "weather"){ if (EC.cur) return ecFocus(null); return closeEco(); }
  if (appOpen === "camera") return closeCamera();
  if (appOpen === "maps"){ if (!$("#mapTip").hidden) return $("#mapTip").hidden = true; return closeMaps(); }
  if (appOpen) return closeFlix();
});
</script>
</body>
