<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>York's World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Caveat:wght@600&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-screen tablet OS — power on → 15s welcome video → shrinks to corner guide → home screen; apps open as full-screen layers */
:root{
  --black:#050507;
  --white:#f5f5f7;
  --muted:#a6a6b0;
  --line:rgba(255,255,255,.14);
  --glass:rgba(16,24,28,.40);
  --panel:#18181b;
  --flix-bg:#0e0e10;
  --flix-red:#d7262f;
  --flix-gold:#f2c14e;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--black);color:var(--white);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Boot ---------- */
#boot{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,3.2vh,44px);transition:opacity .7s ease}
#boot.off{opacity:0;pointer-events:none}
.boot-name{font-family:var(--display);font-size:clamp(34px,5.2vw,96px);letter-spacing:.08em;line-height:1}
.power{width:clamp(96px,10vw,190px);height:clamp(96px,10vw,190px);border-width:2px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;animation:breathe 2.6s ease-in-out infinite;transition:transform .2s}
.power:hover{transform:scale(1.05)}
.power svg{width:38%;height:38%}
.boot-label{font-size:clamp(12px,1.15vw,20px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}

/* ---------- Home screen ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(20px,env(safe-area-inset-left,0px));
  background:
    radial-gradient(60% 50% at 85% 8%, rgba(242,170,74,.55), transparent 70%),
    radial-gradient(55% 55% at 8% 95%, rgba(196,58,88,.50), transparent 70%),
    radial-gradient(70% 60% at 50% 50%, #12404a, transparent 80%),
    #0b2229;}
.statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;padding:4px 6px;font-variant-numeric:tabular-nums}
.status-right{display:flex;gap:8px;align-items:center}
.battery{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.85);border-radius:3px;padding:1.5px;position:relative}
.battery::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.85);border-radius:0 1px 1px 0}
.battery i{display:block;height:100%;width:82%;background:#fff;border-radius:1px}
.home-main{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding-block:20px}
.springboard{width:min(900px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center}
.widgets{display:flex;flex-direction:column;gap:16px;min-width:0}
.widget{border-radius:26px;padding:20px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);text-align:left;width:100%}
.hello{display:flex;gap:16px;align-items:center}
.avatar{flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;letter-spacing:.04em;background:linear-gradient(140deg,#f2aa4a,#c43a58);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.hello h1{margin:0;font-size:22px;letter-spacing:-.01em}
.hello p{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.12);letter-spacing:.02em}
.photos{padding:0;overflow:hidden;position:relative;aspect-ratio:4/3;cursor:pointer;display:block}
.photos .slide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1s ease,transform 6s ease}
.photos .slide.on{opacity:1;transform:scale(1)}
.photos .slide img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.slide.ph-photo{background:linear-gradient(150deg,var(--a),var(--b));display:grid;place-items:center;align-content:center;gap:8px;font-size:12px;color:rgba(255,255,255,.7)}
.ph-photo svg{width:46px;height:46px;opacity:.5}
.photos .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 45%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 28%)}
.p-label{position:absolute;left:18px;top:15px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.p-dots{position:absolute;right:18px;top:19px;display:flex;gap:5px}
.p-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s}
.p-dots i.on{background:#fff}
.p-cap{position:absolute;left:18px;right:18px;bottom:15px;transition:opacity .4s}
.p-cap b{display:block;font-size:18px}
.p-cap span{font-size:12.5px;color:rgba(255,255,255,.82)}
.nowshowing > *{transition:opacity .4s}
.nowshowing.swap > *{opacity:0}
.nowshowing{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .2s}
.nowshowing:hover{transform:translateY(-2px)}
.nowshowing .mini{flex:0 0 74px;aspect-ratio:2/3;border-radius:8px;overflow:hidden}
.ns-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--flix-red);font-weight:700}
.ns-title{font-size:18px;font-weight:700;margin-top:4px}
.ns-sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:4px;line-height:1.4}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(26px,calc(3 * var(--vw,1vw)),40px) clamp(10px,calc(1.4 * var(--vw,1vw)),22px)}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:clamp(12px,calc(1.05 * var(--vw,1vw)),15px);font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.glyph{width:clamp(60px,calc(6.6 * var(--vw,1vw)),98px);max-width:100%;aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.28);transition:transform .18s;position:relative}
.yf-logo{width:66%!important;height:66%!important;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.glyph svg{width:58%;height:58%}
.glyph svg.full{width:100%;height:100%;border-radius:inherit;display:block}
.app-icon:hover .glyph{transform:translateY(-2px)}
.app-icon:active .glyph{transform:scale(.9)}
.app-icon.hint .glyph{animation:hint 1.5s ease-out infinite}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75),0 8px 18px rgba(0,0,0,.28)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0),0 8px 18px rgba(0,0,0,.28)}}
.yf-glyph{font-family:var(--display);color:var(--flix-red);font-size:44px;line-height:1;transform:translateY(1px)}
.dock{align-self:center;display:flex;gap:clamp(14px,calc(1.8 * var(--vw,1vw)),26px);padding:clamp(10px,calc(1.2 * var(--vw,1vw)),16px) clamp(14px,calc(1.6 * var(--vw,1vw)),22px);border-radius:clamp(26px,calc(2.6 * var(--vw,1vw)),38px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);max-width:100%}
.dock .app-icon span{display:none}
.dock .glyph{width:clamp(56px,calc(6.4 * var(--vw,1vw)),92px)}
@media (min-width:1000px){
  .springboard{width:min(1240px,100%);gap:56px}
  .statusbar{font-size:15px;padding:6px 10px}
  .widgets{gap:22px}
  .widget{border-radius:30px}
  .nowshowing{padding:22px;gap:20px}
  .nowshowing .mini{flex-basis:100px}
  .ns-label{font-size:12px}
  .ns-title{font-size:22px}
  .ns-sub{font-size:14.5px}
  .p-label{font-size:12px;left:22px;top:18px}
  .p-dots{right:22px;top:22px}
  .p-cap{left:22px;right:22px;bottom:20px}
  .p-cap b{font-size:23px}
  .p-cap span{font-size:14.5px}
}

@media (max-width:720px){
  .springboard{grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
  .home-main{align-items:flex-start}
  .glyph{width:60px}
  .dock{gap:12px;padding:10px 12px}
  .dock .glyph{width:54px}
}

/* wallpaper layers */
.statusbar,.home-main,.dock{position:relative;z-index:1}
.wall-photo{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.15);opacity:.55}
.wall-photo[hidden]{display:none}
.wall-type{position:absolute;left:50%;transform:translateX(-50%);bottom:-5vw;font-family:var(--display);font-size:calc(36 * var(--vw,1vw));line-height:.8;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.09);pointer-events:none;user-select:none;white-space:nowrap}

/* three-column springboard */
.widgets.right{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media (min-width:1000px){
  .springboard{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.95fr);align-items:center}
  .widgets.right{grid-column:auto;display:flex;flex-direction:column;gap:22px}
}
@media (max-width:720px){.widgets.right{grid-template-columns:minmax(0,1fr)}}
.w-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7)}

.clock{display:flex;align-items:center;gap:16px}
.dial{flex:0 0 auto;width:clamp(60px,calc(6 * var(--vw,1vw)),84px);height:auto}
.c-time{font-size:clamp(22px,calc(2.1 * var(--vw,1vw)),30px);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.c-line{font-size:13px;color:rgba(255,255,255,.78);line-height:1.4;margin-top:2px}

.pod{display:flex;gap:16px;align-items:center;color:inherit;text-decoration:none;transition:transform .2s;flex-wrap:wrap}
.pod:hover{transform:translateY(-2px)}
.pod-cover{flex:0 0 auto;width:clamp(72px,calc(6.6 * var(--vw,1vw)),96px);aspect-ratio:1;border-radius:14px;object-fit:cover;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.pod-body{flex:1 1 140px;min-width:0}
.pod-name{font-size:clamp(17px,calc(1.5 * var(--vw,1vw)),20px);font-weight:700;margin-top:3px}
.pod-sub{font-size:13px;color:rgba(255,255,255,.78);line-height:1.4;margin-top:3px}
.pod-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.pod-play{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:7px 13px 7px 10px;border-radius:99px;background:#fff;color:#111}
.pod-play svg{width:14px;height:14px}
.pod-eps{font-size:12.5px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}

.note{position:relative;text-align:left;padding:26px 24px 18px;border-radius:6px;transform:rotate(-1.6deg);color:#1b1b24;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(70,110,200,.16) 27px 28px) 0 18px/100% auto,#f9f9f6;
  box-shadow:0 14px 30px rgba(0,0,0,.35);border:0;transition:transform .25s}
.note::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1.5px;background:rgba(214,60,80,.35)}
.note::after{content:"";position:absolute;left:50%;top:-11px;width:92px;height:24px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.note:hover{transform:rotate(-.6deg) translateY(-2px)}
.note.flip{animation:flip .5s ease}
@keyframes flip{50%{transform:rotate(-1.6deg) rotateY(90deg)}}
.note .q{font-family:"Permanent Marker","Comic Sans MS",cursive;font-size:clamp(17px,calc(1.55 * var(--vw,1vw)),21px);line-height:1.35;margin:0 0 10px 10px;text-wrap:balance}
.note .by{font-family:"Caveat","Segoe Print",cursive;font-size:clamp(17px,calc(1.5 * var(--vw,1vw)),20px);color:#c43a58;margin:0 0 0 10px;line-height:1.2}
.note .tap{position:absolute;right:14px;bottom:8px;font-family:"Caveat",cursive;font-size:14px;color:#8a8a96}

/* dim layer while the welcome video plays */
#dim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .6s}
#dim.off{opacity:0;pointer-events:none}

/* ---------- Presenter (welcome video → corner guide) ---------- */
#presenter{position:fixed;z-index:85;overflow:hidden;background:#111;box-shadow:0 30px 80px rgba(0,0,0,.55);
  transition:left .7s cubic-bezier(.65,0,.25,1),top .7s cubic-bezier(.65,0,.25,1),width .7s cubic-bezier(.65,0,.25,1),height .7s cubic-bezier(.65,0,.25,1),border-radius .7s,opacity .3s}
#presenter[hidden],#presenter .ph[hidden]{display:none}
#presenter.pip{cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.85)}
#presenter.away{opacity:0;pointer-events:none}
#presenter video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#presenter video[hidden]{display:none}
.ph-sub{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:3;max-width:88%;width:max-content;padding:.35em .8em;border-radius:10px;background:rgba(0,0,0,.62);color:#fff;font-weight:600;font-size:clamp(15px,2.3vw,30px);line-height:1.3;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.ph-sub[hidden],#presenter.pip .ph-sub{display:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:radial-gradient(80% 90% at 70% 20%,rgba(242,170,74,.5),transparent 60%),radial-gradient(70% 80% at 10% 100%,rgba(196,58,88,.55),transparent 60%),#0d2a31}
.ph-tag{position:absolute;left:14px;top:12px;font-size:clamp(11px,.9vw,15px);letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.45);padding:5px 9px;border-radius:6px;color:rgba(255,255,255,.8)}
.ph-line{font-family:var(--display);font-size:clamp(28px,5.4vw,110px);letter-spacing:.02em;line-height:1.05;padding:0 24px;text-wrap:balance;animation:lineIn .7s ease both}
.ph-small{display:block;font-family:var(--ui);font-size:clamp(13px,1.6vw,28px);letter-spacing:.02em;margin-top:10px;color:rgba(255,255,255,.8);font-weight:500}
@keyframes lineIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph-avatar{display:none;font-family:var(--display);font-size:32px;letter-spacing:.04em}
#presenter.pip .ph-tag,#presenter.pip .ph-text,#presenter.pip .prog{display:none}
#presenter.pip .ph-avatar{display:block}
.prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--white);opacity:.85}
#skip{position:fixed;z-index:86;font-size:clamp(13px,1vw,18px);font-weight:600;padding:.6em 1.1em;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--line)}
#skip:hover{background:rgba(255,255,255,.26)}

#bubble{position:fixed;z-index:84;width:min(300px,calc(calc(100 * var(--vw,1vw)) - 32px));padding:14px 16px 12px;border-radius:18px;background:rgba(250,250,252,.96);color:#141418;box-shadow:0 14px 34px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
#bubble.off{opacity:0;transform:translateY(8px);pointer-events:none}
.b-who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c43a58}
.b-text{margin:6px 0 10px;font-size:15px;line-height:1.45;font-weight:500}
.b-row{display:flex;align-items:center;gap:6px}
.b-count{font-size:12px;color:#6b6b75;margin-right:auto;font-variant-numeric:tabular-nums}
.b-btn{width:30px;height:30px;border-radius:50%;background:#ececf0;display:grid;place-items:center;font-size:16px;color:#141418}
.b-btn:hover{background:#dedee4}
.b-btn:focus-visible{outline-color:#141418}

/* ---------- Coming-soon sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
.sheet{width:min(400px,100%);border-radius:24px;padding:26px;background:rgba(28,30,34,.92);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);text-align:center;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet .glyph{margin:0 auto 14px;width:76px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .soon{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--flix-gold);font-weight:700}
.sheet p{color:rgba(255,255,255,.78);line-height:1.5;font-size:14.5px;margin:12px 0 20px}
.pill-btn{padding:10px 22px;border-radius:99px;background:var(--white);color:#111;font-weight:700;font-size:14px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* ---------- YorkFlix ---------- */
#app{position:fixed;inset:0;z-index:60;background:var(--flix-bg);overflow-y:auto;overflow-x:hidden;animation:appIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:scale(.55);filter:blur(16px)}55%{filter:blur(0)}to{opacity:1;transform:none;filter:none}}
@keyframes appOut{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:scale(.55);filter:blur(16px)}}
#app,#mapsApp,#musicApp,#filesApp,#boothApp,#munApp,#ecoApp{transform-origin:var(--ax,50%) var(--ay,50%)}
#app.app-out,#mapsApp.app-out,#musicApp.app-out,#filesApp.app-out,#boothApp.app-out,#munApp.app-out,#ecoApp.app-out{animation:appOut .3s cubic-bezier(.5,0,.75,0) forwards!important;pointer-events:none}
#home{transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
body.in-app #home{transform:scale(1.08);filter:blur(12px) brightness(.7)}
@media (prefers-reduced-motion:reduce){#app,#mapsApp,#musicApp,#filesApp,#boothApp,#munApp{animation:none!important}#home{transition:none}}
.flix-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(24px,env(safe-area-inset-right,0px)) 14px max(24px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--flix-bg) 35%,rgba(14,14,16,0))}
.wordmark{font-family:var(--display);color:var(--flix-red);font-size:30px;letter-spacing:.03em;line-height:1}
.flix-nav{display:flex;gap:18px;font-size:14px}
.flix-nav button{color:rgba(255,255,255,.72)}
.flix-nav button:hover{color:#fff}
.close-app{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 14px 8px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.close-app:hover{background:rgba(255,255,255,.2)}
.close-app svg{width:16px;height:16px}
@media (max-width:620px){.flix-nav{display:none}.wordmark{font-size:26px}}

.gate{min-height:calc(100% - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px 24px 80px;text-align:center}
.gate h2{margin:0;font-size:clamp(28px,calc(3.6 * var(--vw,1vw)),62px);font-weight:600;letter-spacing:-.01em}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(26px,calc(3.4 * var(--vw,1vw)),60px)}

.mu-table tr.row{cursor:pointer}
.mu-table tr.row td{padding:8px 12px}
.mu-table tr.row td:first-child{border-radius:6px 0 0 6px}
.mu-table tr.row td:last-child{border-radius:0 6px 6px 0}
.mu-table tr.row:hover td{background:#2a2a2a}
.mu-table tr.row.cur td{background:#333}
.mu-table tbody:before{content:"";display:block;height:10px}
.mu-ttl{display:flex;align-items:center;gap:12px;min-width:0}
.mu-ttl img{width:44px;height:44px;border-radius:4px;object-fit:cover;flex:none}
.mu-ttl b{display:block;color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-ttl small{display:block;font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-ttl > div{min-width:0}
tr.cur .mu-ttl b{color:var(--mu-green)}
.mu-num .pl{display:none;width:14px;height:14px;color:#fff}
tr.row:hover .mu-num .nm{display:none}
tr.row:hover .mu-num .pl{display:inline}
.eq{display:none;align-items:flex-end;gap:2px;height:14px;justify-content:flex-end}
.eq i{width:3px;background:var(--mu-green);animation:eq .9s ease-in-out infinite;border-radius:1px}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
tr.cur.is-playing .eq{display:inline-flex}
tr.cur.is-playing .nm,tr.cur.is-playing:hover .pl{display:none!important}
#musicApp.paused .eq i{animation-play-state:paused}
.mu-where{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.mu-note{margin-top:28px;font-size:13px;color:#8a8a8a}
/* now playing (video) */
.mu-np{display:grid;grid-template-columns:1fr 340px;height:100%;min-height:0}
.mu-stage{position:relative;overflow:hidden;background:#000;display:grid;place-items:center;min-height:0}
.mu-stage .blur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.45);transform:scale(1.1)}
.mu-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.mu-stage .mu-tap{position:absolute;inset:0;z-index:1}
.mu-stage .mu-bigplay{position:absolute;z-index:2;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .2s;pointer-events:none}
.mu-stage .mu-bigplay svg{width:34px;height:34px}
#musicApp.paused .mu-stage .mu-bigplay{opacity:1}
.mu-info{overflow:auto;padding:20px 18px 28px;border-left:1px solid #242424}
.mu-backall{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;margin:0 0 16px;border-radius:99px;background:#fff;color:#000!important;font-size:14.5px;font-weight:700;transition:transform .15s}
.mu-backall:hover{transform:scale(1.03)}
.mu-backall svg{width:17px;height:17px}
.mu-backall.mu-onstage{position:absolute;z-index:3;top:14px;left:14px;width:auto;margin:0;padding:8px 14px 8px 10px;background:rgba(0,0,0,.6);color:#fff!important;backdrop-filter:blur(8px);font-size:13.5px}
.mu-info .lbl{font-size:16px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.mu-info .lbl button{color:var(--mu-dim);font-size:13px;font-weight:600}
.mu-info .lbl button:hover{color:#fff}
.mu-info .cover{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;display:block}
.mu-info h3{font-size:22px;margin:16px 0 4px;letter-spacing:-.01em;line-height:1.2}
.mu-info .by{color:var(--mu-dim);font-size:14.5px;margin:0}
.mu-card{background:#242424;border-radius:8px;padding:14px 16px;margin-top:16px}
.mu-card h4{margin:0 0 6px;font-size:15px}
.mu-card .tag{display:inline-block;font-size:12px;font-weight:700;color:#000;background:var(--mu-green);border-radius:99px;padding:3px 9px;margin-bottom:8px}
.mu-card p{margin:0;font-size:14px;color:var(--mu-dim);line-height:1.55}
.mu-card .cred{margin-top:8px;font-size:13.5px;color:var(--mu-dim)}
.mu-card .cred b{color:#fff;font-weight:600}
.mu-next{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:6px;text-align:left;margin-top:6px}
.mu-next:hover{background:#2f2f2f}
.mu-next img{width:44px;height:44px;border-radius:4px;object-fit:cover}
.mu-next b{display:block;font-size:14.5px;font-weight:500}
.mu-next small{display:block;color:var(--mu-dim);font-size:13px;margin-top:2px}
/* bottom player bar */
.mu-bar{grid-column:1 / -1;display:grid;grid-template-columns:minmax(180px,30%) 1fr minmax(180px,30%);align-items:center;gap:12px;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);min-height:72px}
.mu-now{display:flex;align-items:center;gap:12px;min-width:0}
.mu-now img{width:56px;height:56px;border-radius:5px;object-fit:cover;cursor:pointer;flex:none}
.mu-now b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mu-now b:hover{text-decoration:underline}
.mu-now small{display:block;font-size:12.5px;color:var(--mu-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-now > div{min-width:0}
.mu-now .heart{color:var(--mu-green);flex:none}
.mu-now .heart svg{width:18px;height:18px}
.mu-ctl{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:720px;width:100%;justify-self:center}
.mu-btns{display:flex;align-items:center;gap:20px}
.mu-btns button{color:var(--mu-dim)}
.mu-btns button:hover{color:#fff}
.mu-btns button svg{width:18px;height:18px;display:block}
.mu-btns button.on{color:var(--mu-green)}
#musicApp .mu-btns .pp{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
#musicApp .mu-btns .pp:hover{color:#000;transform:scale(1.05)}
.mu-btns .pp svg{width:16px;height:16px}
.mu-prog{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--mu-dim);font-variant-numeric:tabular-nums}
.mu-prog span{min-width:36px;text-align:center}
.mu-range{flex:1;height:14px;display:flex;align-items:center;cursor:pointer;position:relative;touch-action:none}
.mu-range .track{height:4px;width:100%;border-radius:2px;background:#4d4d4d;overflow:hidden}
.mu-range .fill{height:100%;background:#fff;width:0}
.mu-range:hover .fill{background:var(--mu-green)}
.mu-range .knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;left:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mu-range:hover .knob{opacity:1}
.mu-right{display:flex;align-items:center;justify-content:flex-end;gap:14px;color:var(--mu-dim)}
.mu-right button:hover{color:#fff}
.mu-right button.on{color:var(--mu-green)}
.mu-right svg{width:18px;height:18px;display:block}
.mu-right .mu-range{flex:0 0 96px}
.mu-pill{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:#2a2a2a;color:#fff}
.mu-pill svg{width:15px!important;height:15px!important}
@media (max-width:900px){.mu-np{grid-template-columns:1fr}.mu-info{border-left:0;border-top:1px solid #242424}.mu-stage{min-height:58vh}.mu-np{height:auto}.mu-info .cover{display:none}}
@media (max-width:760px){
  #musicApp{grid-template-columns:1fr;padding:0;gap:0}
  .mu-side,.mu-search,.mu-nav,.mu-table th.w,.mu-table td.w,.mu-right .vol,.mu-right .mu-range,.mu-btns .sh,.mu-btns .rp{display:none}
  .mu-top{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
  #musicApp .close-app{margin-left:auto}
  .mu-table th.t,.mu-table td.t{width:48px;padding-left:4px}
  .mu-main{border-radius:0}
  .mu-head{flex-direction:column;align-items:flex-start;padding:24px 16px 18px;gap:16px}
  .mu-body{padding:16px 10px 30px}
  .mu-table th.n,.mu-table td.n{width:30px;padding-right:6px}
  .mu-bar{grid-template-columns:1fr auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:#181818}
  .mu-ctl{grid-column:1 / -1;grid-row:2}
  .mu-right{grid-column:2;grid-row:1}
}
/* ---------- Files app: résumé reader ---------- */
#filesApp{--fl-bg:#0b1426;--fl-side:#0f1b33;--fl-page:#13213d;--fl-line:#22355a;--fl-text:#e4ebf6;--fl-dim:#93a3bf;--fl-head:#ffffff;--fl-acc:#7cb0ff;--fl-chip:#1b2b4b;
  position:fixed;inset:0;z-index:60;background:var(--fl-bg);color:var(--fl-text);display:flex;flex-direction:column;font-family:var(--ui);animation:appIn .32s cubic-bezier(.2,.8,.2,1)}
#filesApp[hidden]{display:none}
.fl-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(11,20,38,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--fl-line)}
.fl-crumbs{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--fl-dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.fl-crumbs i{font-style:normal;color:#5b6d8e}
.fl-crumbs b{color:var(--fl-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.fl-ico svg{width:22px;height:22px;display:block}
.fl-btn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;background:#2f6fd0;color:#fff;text-decoration:none;white-space:nowrap}
.fl-btn:hover{background:#3b7ee4}
.fl-btn svg{width:16px;height:16px}
.fl-btn.ghost{background:var(--fl-chip);color:var(--fl-text)}
.fl-btn.ghost:hover{background:#243a63}
#filesApp .close-app{margin-left:0;background:var(--fl-chip);color:var(--fl-text)}
.fl-body{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0}
.fl-toc{padding:22px 12px;border-right:1px solid var(--fl-line);background:var(--fl-side);overflow:auto;display:flex;flex-direction:column;gap:2px}
.fl-toc-h{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6f82a3;margin:0 10px 10px}
.fl-toc button{text-align:left;font-size:14px;font-weight:500;padding:9px 12px;border-radius:8px;color:#c4d0e4}
.fl-toc button:hover{background:#18284a}
.fl-toc button.on{background:#2f6fd0;color:#fff;font-weight:600}
.fl-toc-dl{margin:16px 10px 0;font-size:13px;font-weight:600;color:var(--fl-acc);text-decoration:none}
.fl-scroll{overflow:auto;padding:32px 24px 80px;position:relative;scroll-behavior:smooth}
.rs-page{max-width:820px;margin:0 auto;background:var(--fl-page);color:var(--fl-text);border:1px solid var(--fl-line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:48px 56px 40px;font-size:14.5px;line-height:1.55}
.rs-head{padding-bottom:18px;border-bottom:2px solid var(--fl-acc)}
.rs-head h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;letter-spacing:-.01em;margin:0;line-height:1.05;color:var(--fl-head)}
.rs-tag{margin:8px 0 0;color:var(--fl-dim);font-size:14px}
.rs-contact{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;margin-top:12px}
.rs-contact a{color:var(--fl-acc);text-decoration:none}
.rs-contact a:hover{text-decoration:underline}
.rs-sec{padding-top:24px;scroll-margin-top:14px}
.rs-sec h3{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fl-acc);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--fl-line)}
.rs-item{display:grid;grid-template-columns:108px 1fr;gap:16px;margin-bottom:14px}
.rs-when{font-size:13px;font-weight:600;color:var(--fl-dim);padding-top:1px}
.rs-what h4{margin:0;font-size:15px;color:var(--fl-head)}
.rs-org{color:var(--fl-dim);font-size:13.5px;margin-top:1px}
.rs-what ul{margin:6px 0 0;padding-left:18px}
.rs-what li{margin:2px 0}
.rs-what li::marker{color:var(--fl-acc)}
.rs-what b{color:var(--fl-head)}
.rs-mun{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;color:var(--fl-text)}
.rs-mun th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fl-dim);padding:6px 8px;border-bottom:1px solid var(--fl-line)}
.rs-mun td{padding:5px 8px;border-bottom:1px solid #1a2a49;color:var(--fl-text)}
.rs-mun tr:nth-child(even) td{background:#172848}
.rs-sec h5{margin:12px 0 6px;font-size:13.5px;color:var(--fl-head)}
.rs-awards{list-style:none;margin:0;padding:0}
.rs-awards li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:3px 0}
.rs-awards li span{font-weight:600;color:var(--fl-dim);font-size:13px}
.rs-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--fl-line);font-size:12.5px;color:var(--fl-dim);text-align:center}
.rs-foot a{color:var(--fl-acc)}
.fl-top-btn{position:sticky;float:right;bottom:20px;margin-right:-8px;padding:9px 14px;border-radius:99px;background:#2f6fd0;color:#fff;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fl-top-btn.show{opacity:1;pointer-events:auto}
@media (max-width:860px){
  .fl-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .fl-toc{flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--fl-line);gap:6px;scrollbar-width:none}
  .fl-toc::-webkit-scrollbar{display:none}
  .fl-toc-h,.fl-toc-dl{display:none}
  .fl-toc button{white-space:nowrap;background:var(--fl-chip);border-radius:99px;padding:7px 13px;font-size:13px}
  .fl-scroll{padding:14px 10px 70px}
  .rs-page{padding:26px 20px 26px}
  .rs-head h1{font-size:32px}
  .rs-contact{flex-direction:column}
  .rs-item{grid-template-columns:1fr;gap:2px}
  .fl-btn span{display:none}
  .fl-crumbs{font-size:0}
  .fl-crumbs b{font-size:14px}
  .rs-mun{font-size:12px}.rs-mun th,.rs-mun td{padding:5px 4px}
}
/* ---------- Camera app: photo booth (dark, futuristic) ---------- */
#boothApp{--bt-bg:#05070d;--bt-panel:rgba(16,22,38,.78);--bt-line:rgba(120,160,255,.16);--bt-text:#e8eeff;--bt-dim:#8a96b8;
  --bt-cyan:#3ef0ff;--bt-violet:#8b5cff;--bt-pink:#ff4fd8;--bt-grad:linear-gradient(100deg,#3ef0ff,#8b5cff 55%,#ff4fd8);
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--bt-text);font-family:var(--ui);
  background:
    radial-gradient(900px 500px at 10% -10%,rgba(62,240,255,.14),transparent 60%),
    radial-gradient(800px 600px at 110% 110%,rgba(139,92,255,.2),transparent 60%),
    linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px) 0 0/44px 44px,
    var(--bt-bg);
  animation:appIn .32s cubic-bezier(.2,.8,.2,1)}
#boothApp[hidden]{display:none}
#boothApp [hidden]{display:none!important}
#boothApp button{font-family:inherit;color:inherit}
.bt-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.bt-top{display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;border-bottom:1px solid var(--bt-line)}
.bt-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.16em;white-space:nowrap}
.bt-logo i{width:12px;height:12px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 12px #ff3b5c;animation:btRec 1.6s ease-in-out infinite}
.bt-logo em{font-style:normal;background:var(--bt-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes btRec{50%{opacity:.25}}
.bt-steps{display:flex;gap:4px;list-style:none;margin:0 auto;padding:0;counter-reset:s}
.bt-steps li{counter-increment:s;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;color:#56607e;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent}
.bt-steps li::before{content:"0" counter(s);font-family:ui-monospace,Menlo,monospace;font-size:11px;color:inherit;opacity:.8}
.bt-steps li.on{color:#fff;border-color:var(--bt-cyan);text-shadow:0 0 12px rgba(62,240,255,.6)}
.bt-steps li.done{color:var(--bt-dim)}
#boothApp .close-app{margin-left:0;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--bt-line)}
.bt-screen{flex:1;min-height:0;overflow:auto;padding:14px 22px 26px}
.bt-screen h2{font-size:clamp(26px,3.2vw,40px);margin:10px 0 6px;text-align:center;letter-spacing:-.02em;font-weight:800}
.bt-screen h2 span{background:var(--bt-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bt-lead{text-align:center;color:var(--bt-dim);margin:0 0 22px;font-size:15.5px}
#btPick{display:flex;flex-direction:column;padding-bottom:16px}
#btPick h2{margin:2px 0 2px}
#btPick .bt-lead{margin:0 0 14px}
.bt-swipe{display:none;text-align:center;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--bt-dim);margin:4px 0 0}

.bt-tpls{flex:1;min-height:0;display:grid;--cw:min(calc((100vw - 120px) / 3),calc((100vh - 255px) * .6667 + 24px));grid-template-columns:repeat(3,var(--cw));gap:28px;justify-content:center;align-items:start}
@media (orientation:portrait){
  .bt-tpls{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding:4px 8vw 10px;margin:0 -22px;justify-content:flex-start;scrollbar-width:none;align-items:flex-start}
  .bt-tpls::-webkit-scrollbar{display:none}

.bt-tpl{position:relative;background:var(--bt-panel);border:1px solid var(--bt-line);border-radius:18px;padding:12px 12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left}

.bt-tpl b{font-size:16px;letter-spacing:.02em}
.bt-tpl small{color:var(--bt-dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
.bt-tpl .no{position:absolute;top:20px;left:20px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--bt-cyan);background:rgba(5,7,13,.7);padding:3px 7px;border-radius:5px;border:1px solid rgba(62,240,255,.35)}
.bt-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14.5px;letter-spacing:.02em;background:rgba(255,255,255,.07);border:1px solid var(--bt-line);text-decoration:none;color:var(--bt-text);cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.bt-btn:hover{background:rgba(255,255,255,.12)}
.bt-btn:disabled{opacity:.45;cursor:default}
.bt-btn.pink{background:var(--bt-grad);border:0;color:#05070d!important;box-shadow:0 8px 28px rgba(139,92,255,.35)}
.bt-btn.pink:hover{box-shadow:0 10px 36px rgba(62,240,255,.45);transform:translateY(-1px)}
.bt-btn.ghost{background:rgba(255,255,255,.05)}
.bt-btn.big{padding:15px 22px;font-size:16px;width:100%}
.bt-shootwrap{display:grid;grid-template-columns:1fr 260px;gap:24px;height:100%;max-width:1200px;margin:0 auto;align-items:center}
.bt-live{position:relative;max-height:100%;max-width:100%;margin:0 auto;height:100%;border-radius:14px;overflow:hidden;background:#0b1020;box-shadow:0 0 0 1px rgba(62,240,255,.35),0 0 60px rgba(62,240,255,.12)}
.bt-live video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.bt-york{position:absolute;bottom:0;width:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.bt-hud{position:absolute;inset:14px;pointer-events:none}
.bt-hud i{position:absolute;width:26px;height:26px;border:2px solid var(--bt-cyan);opacity:.85}
.bt-hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.bt-hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.bt-hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.bt-hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.bt-hud b{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:1px solid rgba(255,255,255,.5);border-radius:50%}
.bt-hud span{position:absolute;right:6px;top:6px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#fff;display:flex;align-items:center;gap:6px}
.bt-hud span::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 10px #ff3b5c;animation:btRec 1.2s infinite}
.bt-count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.bt-count .ring{position:relative;height:min(72%,46vh);aspect-ratio:1;display:grid;place-items:center;opacity:0}
.bt-count .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.bt-count .ring circle{fill:none;stroke-width:3}
.bt-count .ring .bg{stroke:rgba(255,255,255,.18)}
.bt-count .ring .fg{stroke:url(#btGrad);stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302}
.bt-count .num{font:800 clamp(56px,min(20vh,18vw),200px)/1 var(--ui);color:#fff;text-shadow:0 0 30px rgba(62,240,255,.8),0 0 70px rgba(139,92,255,.6);letter-spacing:-.04em}
.bt-count.pop .ring{opacity:1;animation:btRing 1s ease-out}
.bt-count.pop .fg{animation:btSweep 1s linear forwards}
.bt-count.pop .num{animation:btNum 1s ease-out}
.bt-count .say{position:absolute;bottom:12%;left:0;right:0;text-align:center;font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--bt-cyan);opacity:0}
.bt-count.pop .say{opacity:1}
@keyframes btRing{0%{transform:scale(1.25);opacity:0}20%{transform:scale(1);opacity:1}}
@keyframes btSweep{to{stroke-dashoffset:0}}
@keyframes btNum{0%{transform:scale(1.6);opacity:0;filter:blur(8px)}22%{transform:scale(1);opacity:1;filter:blur(0)}85%{opacity:1}100%{opacity:.2;transform:scale(.92)}}
.bt-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.bt-flash.go{animation:btFlash .55s ease-out}
@keyframes btFlash{0%{opacity:1}100%{opacity:0}}
.bt-shotlabel{position:absolute;left:24px;top:22px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(5,7,13,.6);padding:6px 10px;border-radius:6px;border:1px solid var(--bt-line)}
.bt-nocam{position:absolute;inset:0;display:grid;place-content:center;gap:16px;text-align:center;color:#fff;padding:20px;background:#0b1020}
.bt-nocam p{margin:0;line-height:1.55;color:var(--bt-dim)}
.bt-nocam p b{color:#fff}
.bt-side{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.bt-side canvas{width:100%;border-radius:10px;border:1px solid var(--bt-line);background:#0b1020}
.bt-side .tip{font-size:12.5px;color:var(--bt-dim);line-height:1.5;margin:2px 2px 0}
.bt-editwrap{display:grid;grid-template-columns:auto 330px;gap:24px;height:100%;justify-content:center;align-items:start}
.bt-stage{position:relative;height:calc(100vh - 150px);max-height:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(62,240,255,.35),0 0 60px rgba(139,92,255,.18);touch-action:none}
.bt-stage canvas{position:absolute;inset:0;width:100%;height:100%}
#btDraw{cursor:crosshair}
.bt-tools{background:var(--bt-panel);border:1px solid var(--bt-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(14px)}
.bt-group h4{margin:0 0 9px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--bt-dim)}
.bt-seg{display:flex;gap:6px}
.bt-seg.wrap{flex-wrap:wrap}
.bt-seg button{flex:1;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--bt-line);font-weight:600;font-size:13.5px;white-space:nowrap}
.bt-seg button.on{background:rgba(62,240,255,.12);border-color:var(--bt-cyan);color:#fff;box-shadow:0 0 16px rgba(62,240,255,.25)}
.bt-colors{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.bt-colors button{aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),inset 0 0 0 1px rgba(255,255,255,.25)}
.bt-colors button.on{box-shadow:0 0 0 2px #05070d,0 0 0 4px #fff,0 0 16px var(--c)}
.bt-stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bt-stamps button{font-size:22px;padding:6px 0;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--bt-line)}
.bt-stamps button.on{border-color:var(--bt-cyan);box-shadow:0 0 14px rgba(62,240,255,.3)}
.bt-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--bt-dim)}
.bt-row input[type=range]{flex:1;accent-color:var(--bt-cyan)}
.bt-row input[type=checkbox]{accent-color:var(--bt-cyan);width:18px;height:18px}
.bt-row2{display:flex;gap:8px}
.bt-row2 > *{flex:1}
.bt-row2.end{margin-top:auto}
.bt-sendwrap{display:grid;grid-template-columns:auto minmax(280px,420px);gap:34px;justify-content:center;align-items:center;height:100%}
#btFinal{height:calc(100vh - 160px);max-height:100%;aspect-ratio:2/3;border-radius:12px;box-shadow:0 0 0 1px rgba(62,240,255,.35),0 0 70px rgba(139,92,255,.25)}
.bt-form,.bt-done{display:flex;flex-direction:column;gap:12px;background:var(--bt-panel);border:1px solid var(--bt-line);border-radius:18px;padding:24px;backdrop-filter:blur(14px)}
.bt-form h2,.bt-done h2{text-align:left;margin:0}
.bt-form .bt-lead,.bt-done .bt-lead{text-align:left;margin:0 0 4px}
.bt-form label{display:flex;flex-direction:column;gap:6px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--bt-dim)}
.bt-form input,.bt-form textarea{font:400 16px var(--ui);letter-spacing:0;text-transform:none;border:1px solid var(--bt-line);border-radius:10px;padding:11px 12px;background:rgba(5,7,13,.6);color:var(--bt-text);resize:vertical}
.bt-form input:focus,.bt-form textarea:focus{outline:none;border-color:var(--bt-cyan);box-shadow:0 0 0 3px rgba(62,240,255,.15)}
.bt-link{background:none;color:var(--bt-dim)!important;font-weight:600;font-size:13.5px;align-self:center}
.bt-link:hover{color:#fff!important}
.bt-status{margin:0;font-size:13.5px;color:#ffb36b;min-height:1em}
.bt-privacy{font-size:12px;color:#5f6a8a;margin:0;line-height:1.5}
@media (max-width:900px){
  .bt-steps{display:none}
  .bt-top{justify-content:space-between}
  .bt-logo{font-size:15px}
  .bt-screen{padding:8px 12px 20px}

  .bt-shootwrap{grid-template-columns:1fr;height:auto}
  .bt-live{height:auto;width:100%;max-height:62vh}
  .bt-side{flex-direction:row;flex-wrap:wrap}
  .bt-side canvas{width:84px;flex:none}
  .bt-side .bt-btn{flex:1}
  .bt-side .tip{display:none}
  .bt-editwrap{grid-template-columns:1fr;height:auto}
  .bt-stage{height:auto;width:100%;max-width:440px;margin:0 auto}
  .bt-sendwrap{grid-template-columns:1fr;height:auto}
  #btFinal{height:auto;width:min(100%,360px);margin:6px auto 0}
}
/* ---------- MUN app: My MUN Journey (first-person board) ---------- */
#munApp{--mj-disp:Oswald,"Arial Narrow",sans-serif;--mj-body:Archivo,var(--ui);--mj-bg:#121316;--mj-line:#2a2c33;--mj-text:#f2efe6;--mj-dim:#9a9890;
  --mj-red:#d7261e;--mj-cream:#f6f1e3;--mj-ink:#16130e;--mj-board:#cfe6d3;
  position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:minmax(0,3fr) minmax(360px,2fr);grid-template-rows:auto minmax(0,1fr);color:var(--mj-text);font-family:var(--mj-body);
  background:var(--mj-bg);overflow:hidden;animation:appIn .32s cubic-bezier(.2,.8,.2,1)}
#munApp[hidden]{display:none}
#munApp button{font-family:inherit;color:inherit}
/* top bar */
.mj-top{grid-column:1 / -1;display:flex;align-items:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;border-bottom:1px solid var(--mj-line);position:relative;z-index:5;background:#0d0e10}
.mj-brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.mj-ico{width:38px;height:38px;overflow:hidden;display:block;border:1px solid #3a3c44}
.mj-ico svg{width:100%;height:100%;display:block}
.mj-brand b{display:block;font:600 20px var(--mj-disp);letter-spacing:.04em;text-transform:uppercase}
.mj-brand small{display:block;font:500 12px var(--mj-disp);letter-spacing:.08em;color:var(--mj-dim);margin-top:1px;text-transform:uppercase}
.mj-prog{flex:1;max-width:360px;height:6px;background:#24262c;overflow:hidden}
.mj-prog i{display:block;height:100%;width:0;background:var(--mj-red);transition:width .9s cubic-bezier(.45,.05,.2,1)}
.mj-stats{display:flex;gap:6px;margin-left:auto}
.mj-stats span{display:flex;align-items:baseline;gap:7px;font:500 12px var(--mj-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mj-dim);padding:6px 12px;border:1px solid #34363e;background:#17181c}
.mj-stats b{font:600 22px var(--mj-disp);color:#fff}
.mj-stats span.pop{animation:mjPop .6s ease-out}
@keyframes mjPop{0%{background:#3a2a10;border-color:#f3c64b}100%{background:#17181c}}
#munApp .close-app{margin-left:0;background:#1d1e22;color:#fff;border:1px solid #34363e;border-radius:0}
/* stage: a dark table with the board on it */
.mj-stage{position:relative;overflow:hidden;min-width:0;perspective:1100px;perspective-origin:50% 22%;min-height:0;
  background:radial-gradient(120% 90% at 50% 75%,#2a2620 0%,#16140f 55%,#0b0a08 100%)}
.mj-board{position:absolute;left:50%;top:66%;width:1380px;height:1380px;transform-origin:0 0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.45,.05,.2,1);will-change:transform;
  background:var(--mj-board);outline:10px solid #f1ede0;box-shadow:0 0 0 13px #1b1a17,0 40px 90px rgba(0,0,0,.6)}
.mj-stage.ov .mj-board{top:58%}
.mj-floor{display:none}
.mj-center{position:absolute;left:230px;top:230px;width:920px;height:920px}
.mj-banner{position:absolute;left:50%;top:50%;width:760px;transform:translate(-50%,-50%) rotate(-45deg);background:var(--mj-red);border:6px solid #fff;outline:4px solid var(--mj-red);
  padding:22px 0 18px;text-align:center;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.mj-banner b{display:block;font:700 104px/1 var(--mj-disp);letter-spacing:.02em;text-transform:uppercase}
.mj-banner small{display:block;font:500 26px var(--mj-disp);letter-spacing:.3em;text-transform:uppercase}
.mj-pile{position:absolute;width:230px;height:150px;border:4px dashed #1f2b22;display:grid;place-content:center;justify-items:center;gap:2px;transform:rotate(-45deg)}
.mj-pile b{font:700 64px/1 var(--mj-disp)}
.mj-pile span{font:600 22px var(--mj-disp);letter-spacing:.12em;text-transform:uppercase}
.mj-pile.chance{left:70px;top:150px;background:#f39a2b;color:#2a1405}
.mj-pile.chest{right:70px;bottom:150px;background:#9fcdf0;color:#0b2c52}
.mj-logo{position:absolute;right:90px;top:60px;width:200px;height:200px;opacity:.9;transform:rotate(-20deg)}
.mj-logo svg{width:100%;height:100%}
/* squares */
.mj-tile{position:absolute;width:230px;height:230px;transform-style:preserve-3d;transition:transform .5s}
.mj-tile-in{position:relative;width:100%;height:100%;background:var(--mj-cream);border:2px solid var(--mj-ink);display:flex;flex-direction:column;overflow:hidden;color:var(--mj-ink);text-align:center}
.mj-tile-in{transition:transform .9s cubic-bezier(.45,.05,.2,1)}
.mj-bar{flex:none;height:56px;border-bottom:2px solid var(--mj-ink)}
.mj-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 12px;min-height:0}
.mj-t-name{font:600 33px/1.02 var(--mj-disp);text-transform:uppercase;letter-spacing:.01em}
.mj-t-name.sm{font-size:25px}
.mj-t-com{font:500 17px/1.15 var(--mj-body);color:#3d382e}
.mj-t-role{font:600 18px var(--mj-disp);text-transform:uppercase;letter-spacing:.06em;margin-top:auto}
.mj-t-yr{font:500 14px var(--mj-disp);letter-spacing:.12em;color:#6a6355}
.mj-t-award{font:600 14px var(--mj-disp);text-transform:uppercase;letter-spacing:.04em;color:#8a1b12}
.mj-t-kind{font:600 20px var(--mj-disp);text-transform:uppercase;letter-spacing:.1em}
.mj-t-ico{font:700 64px/1 var(--mj-disp);color:var(--c)}
.mj-t-small{font:500 15px/1.15 var(--mj-disp);text-transform:uppercase;letter-spacing:.06em}
.mj-gobody{gap:0}
.mj-t-go{font:700 110px/0.9 var(--mj-disp);color:var(--mj-red)}
.mj-t-arrow{font:700 60px/1 var(--mj-disp);color:var(--mj-red)}
.mj-mile .mj-tile-in{background:#fbe3c2}
.mj-trans .mj-tile-in{background:#dcebf7}
.mj-sg .mj-tile-in{background:#e4ecf6}
.mj-sg .mj-bar{height:70px}
.mj-tile.cur{transform:translateZ(14px)}
.mj-tile.cur .mj-tile-in{box-shadow:0 0 0 5px #f3c64b,0 18px 30px rgba(0,0,0,.35)}
.mj-stage.ov .mj-tile-in{transform:none!important}
.mj-stage.ov .mj-tile{cursor:pointer}
.mj-stage.ov .mj-tile:hover{transform:translateZ(20px)}
.mj-stage.ov .mj-tile.cur::after{content:"";position:absolute;inset:-8px;border:6px solid #f3c64b;animation:mjRing 1.4s ease-out infinite;pointer-events:none}
@keyframes mjRing{0%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.mj-vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(11,10,8,1) 0%,rgba(11,10,8,.75) 14%,rgba(11,10,8,0) 40%)}
.mj-stage.ov .mj-vig{opacity:.3}
/* token */
.mj-token{position:absolute;left:50%;top:66%;width:min(26vh,210px);aspect-ratio:1;transform:translate(-50%,-92%);pointer-events:none;transition:opacity .4s;z-index:2}
.mj-stage.ov .mj-token{opacity:0}
.mj-token-g{position:absolute;inset:0;transform-origin:78% 60%;filter:drop-shadow(0 16px 14px rgba(0,0,0,.55))}
.mj-token-g svg{width:100%;height:100%;display:block}
.mj-token-base{position:absolute;left:14%;right:32%;bottom:8%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))}
.mj-token .mj-token-g{animation:mjFloat 3s ease-in-out infinite}
@keyframes mjFloat{50%{transform:translateY(-5px)}}
.mj-token.hop .mj-token-g{animation:mjHop .7s cubic-bezier(.3,.6,.3,1)}
@keyframes mjHop{0%{transform:translateY(0)}40%{transform:translateY(-34%) rotate(-8deg)}100%{transform:translateY(-10%) rotate(-14deg)}}
.mj-token.strike .mj-token-g{animation:mjStrike .55s cubic-bezier(.5,0,.3,1)}
@keyframes mjStrike{0%{transform:translateY(-10%) rotate(-14deg)}35%{transform:translateY(-12%) rotate(-30deg)}55%{transform:translateY(2%) rotate(9deg)}75%{transform:rotate(-3deg)}100%{transform:none}}
.mj-wave{position:absolute;left:50%;top:66%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(255,255,255,.7);opacity:0;pointer-events:none;transform:scaleY(.42)}
.mj-wave.go{animation:mjWave .7s ease-out}
@keyframes mjWave{0%{opacity:.9;transform:scale(.4) scaleY(.42)}100%{opacity:0;transform:scale(5) scaleY(.42)}}
/* side panel */
.mj-panel{position:relative;z-index:3;display:flex;flex-direction:column;gap:16px;padding:18px 22px 0;border-left:1px solid var(--mj-line);background:#101114;min-height:0;overflow:auto}
.mj-cardwrap{flex:none}
.mj-cardwrap.in .mj-card{animation:mjCard .45s cubic-bezier(.2,.8,.2,1)}
@keyframes mjCard{0%{opacity:0;transform:translateY(14px) rotate(-1.2deg)}100%{opacity:1;transform:none}}
.mj-card{background:var(--mj-cream);color:var(--mj-ink);border:2px solid var(--mj-ink);box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.mj-deed-h{margin:10px;border:2px solid var(--mj-ink);background:var(--c);text-align:center;padding:10px 12px 12px;color:var(--mj-ink)}
.mj-sg .mj-deed-h,.mj-deed[style*="#0b5aa8"] .mj-deed-h,.mj-deed[style*="#1fa456"] .mj-deed-h{color:#fff}
.mj-deed-h small{display:block;font:500 13px var(--mj-disp);letter-spacing:.2em;text-transform:uppercase}
.mj-deed-h h3{margin:2px 0 0;font:600 clamp(32px,2.6vw,46px)/1.02 var(--mj-disp);text-transform:uppercase;letter-spacing:.01em}
.mj-rows{margin:6px 18px 0;display:grid}
.mj-rows div{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.mj-rows dt{font:500 clamp(14px,1.1vw,17px) var(--mj-disp);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;display:flex;flex:1;align-items:baseline;gap:8px}
.mj-rows dt::after{content:"";flex:1;border-bottom:2px dotted #8d8573;transform:translateY(-4px)}
.mj-rows dd{margin:0;font:600 clamp(15px,1.2vw,19px)/1.25 var(--mj-body);text-align:right;max-width:62%}
.mj-topic{margin:10px 18px 0;padding-top:12px;border-top:2px solid var(--mj-ink)}
.mj-topic span{font:500 13px var(--mj-disp);letter-spacing:.16em;text-transform:uppercase;color:#6a6355}
.mj-topic p{margin:4px 0 0;font:500 clamp(16px,1.3vw,21px)/1.4 var(--mj-body);text-align:left}
.mj-deed-f{margin:14px 18px 0;padding:8px 0 12px;border-top:1px solid #bdb4a0;font:500 12px var(--mj-disp);letter-spacing:.14em;text-transform:uppercase;color:#6a6355;text-align:center}
.mj-chance{background:#fbe3c2}
.mj-card-trans{background:#dcebf7}
.mj-card-go,.mj-card-end{background:var(--mj-cream)}
.mj-chance-h{margin:10px;border:2px solid var(--mj-ink);background:var(--c);color:#fff;text-align:center;padding:8px;font:600 18px var(--mj-disp);letter-spacing:.18em;text-transform:uppercase}
.mj-chance h3{margin:14px 20px 4px;font:600 clamp(30px,2.4vw,42px)/1.05 var(--mj-disp);text-transform:uppercase;text-align:center}
.mj-com{margin:0 20px;color:#5a5345;font-size:clamp(15px,1.15vw,18px);line-height:1.4;text-align:center}
.mj-text{margin:12px 22px 6px;font:500 clamp(16px,1.25vw,20px)/1.55 var(--mj-body);text-align:center}
.mj-end-btns{display:flex;flex-direction:column;gap:8px;margin:10px 18px 4px}
/* photos */
.mj-gal{flex:none;display:flex;flex-direction:column;gap:8px}
.mj-gal.none{display:none}
.mj-gal-h{display:flex;justify-content:space-between;align-items:baseline;font:500 15px var(--mj-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mj-dim)}
.mj-gal-h span{color:#fff}
.mj-gal-grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.mj-gal-grid .mj-ph{aspect-ratio:4/3}
.mj-gal.n1 .mj-gal-grid{grid-template-columns:1fr}
.mj-gal.n3 .mj-ph:first-child{grid-column:1 / -1}
.mj-gal.n1 .mj-ph,.mj-gal.n3 .mj-ph:first-child{aspect-ratio:16/10;max-height:34vh}
.mj-ph{position:relative;padding:0;border:6px solid #f1ede0;overflow:hidden;background:#0b0a08;min-height:0;cursor:zoom-in;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.mj-ph img{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .4s}
.mj-ph img.fg{object-fit:contain}
.mj-ph img.bgb{object-fit:cover;filter:blur(18px) brightness(.45);transform:scale(1.15)}
.mj-ph:hover img.fg{transform:scale(1.03)}
.mj-ph em{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);font:600 28px var(--mj-disp);font-style:normal;color:#fff}
.mj-ph-empty{display:grid;place-content:center;justify-items:center;gap:2px;height:110px;border:2px dashed #3a3c44;color:var(--mj-dim)}
.mj-ph-empty b{font:500 18px var(--mj-disp);letter-spacing:.1em;text-transform:uppercase;color:#c9c5b9}
.mj-ph-empty span{font-size:13px}

  return `<div class="art${wide?" wide":""}" style="--a:${s.a};--b:${s.b}">
    <div class="motif m-${s.motif}"></div>
    ${s.cut ? `<img class="cut" src="${s.cut}" alt="" loading="lazy" decoding="async"><div class="cut-shade"></div>` : ""}
    <span class="y">Y</span><span class="net">${s.network.split(" · ").join("<br>")}</span>
    ${s.award ? `<span class="rib">Award</span>` : ""}
    <div class="t${long}">${s.title}<small>${s.season}</small></div></div>`;
}
function iconHTML(id){
  const a = APPS[id];
  return `<button class="app-icon" data-app="${id}" aria-label="${a.name}"><div class="glyph" style="background:${a.bg}">${a.svg}</div><span>${a.name}</span></button>`;
}

/* clock widget (always Taipei time) */
$("#ticks").innerHTML = Array.from({length:12},(_,i)=>`<line x1="50" y1="8" x2="50" y2="${i%3?13:16}" stroke="#141418" stroke-width="${i%3?1.4:2.4}" stroke-linecap="round" transform="rotate(${i*30} 50 50)"/>`).join("");
const tpeFmt = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:false});
function taipeiClock(){
  const parts = Object.fromEntries(tpeFmt.formatToParts(new Date()).map(p => [p.type, p.value]));
  const h = (+parts.hour) % 24, m = +parts.minute, s = +parts.second;
  $("#hh").setAttribute("transform",`rotate(${(h%12)*30 + m*.5} 50 50)`);
  $("#mh").setAttribute("transform",`rotate(${m*6 + s*.1} 50 50)`);
  $("#sh").setAttribute("transform",`rotate(${s*6} 50 50)`);
  const h12 = h % 12 || 12, ap = h < 12 ? "AM" : "PM";
  $("#cTime").textContent = `${h12}:${String(m).padStart(2,"0")} ${ap}`;
  const diff = 8 + new Date().getTimezoneOffset()/60;
  const rel = diff === 0 ? "Same time zone as you." : `${Math.abs(diff)} hour${Math.abs(diff)===1?"":"s"} ${diff>0?"ahead of":"behind"} you.`;
  $("#cLine").textContent = `It's ${h12}:${String(m).padStart(2,"0")} ${ap} in Taipei, where I am. ${rel}`;
}
taipeiClock(); setInterval(taipeiClock, 1000);

/* scale the home screen to fill large screens (designed at 1480 x 880) */
const homeEl = $("#home"), homeScale = $("#homeScale");
let homeZ = 1;
function fitHome(){
  const iw = homeEl.clientWidth || innerWidth, ih = homeEl.clientHeight || innerHeight;
  homeZ = iw >= 1000 ? Math.max(1, Math.min(iw / 1480, ih / 880)) : 1;
  const w = iw / homeZ, h = ih / homeZ;
  Object.assign(homeScale.style, { width:w+"px", height:h+"px", transform:`scale(${homeZ})` });
  homeScale.style.setProperty("--vw", (w/100)+"px");
  homeScale.style.setProperty("--vh", (h/100)+"px");
}
fitHome();
addEventListener("resize", fitHome);

function tick(){
  const d = new Date();
  $("#clock").textContent = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/,"");
  $("#dateMini").textContent = d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
tick(); setInterval(tick, 20000);

/* ---------- boot + presenter ---------- */
const presenter = $("#presenter"), bubble = $("#bubble"), skipBtn = $("#skip");
// The corner guide: a silent clip of York that loops forever after the intro.
// Built up front (muted + playsinline + autoplay attributes) so Safari/iOS will autoplay it.
let idleEl = null;
function idleVideo(){
  if (idleEl) return idleEl;
  idleEl = document.createElement("video");
  ["muted","loop","playsinline","autoplay"].forEach(a => idleEl.setAttribute(a, ""));
  idleEl.muted = true; idleEl.loop = true; idleEl.playsInline = true; idleEl.preload = "auto";
  idleEl.className = "idle"; idleEl.hidden = true; idleEl.src = IDLE_VIDEO;
  presenter.prepend(idleEl);
  return idleEl;
}
function playIdle(){ if (idleEl && !idleEl.hidden && idleEl.paused) idleEl.play().catch(() => {}); }
// if the browser blocked autoplay, start it on the next tap/click anywhere
document.addEventListener("pointerdown", playIdle, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) playIdle(); });
new MutationObserver(playIdle).observe(presenter, { attributes:true, attributeFilter:["class"] });
let presState = "stage", introDone = false, tipIdx = 0, bubbleOpen = true, appOpen = null, video = null;

$("#powerBtn").addEventListener("click", startIntro);

function startIntro(){
  $("#boot").classList.add("off");
  $("#dim").classList.remove("off");
  presenter.hidden = false;
  presenter.querySelector(".ph-tag").hidden = IS_LIVE;
  presState = "stage"; layout();
  if (IDLE_VIDEO) idleVideo();
  if (store.get("yorkos_seen") === "1"){ skipBtn.hidden = false; }
  if (WELCOME_VIDEO){
    $("#ph").hidden = true;
    video = document.createElement("video");
    video.src = WELCOME_VIDEO; video.playsInline = true;
    presenter.prepend(video);
    video.addEventListener("timeupdate", e => { const v = e.target; if (v.duration) $("#prog").style.width = (v.currentTime/v.duration*100)+"%";
      const c = WELCOME_SUBS.find(([a, b]) => v.currentTime >= a && v.currentTime < b), sub = $("#phSub");
      if (sub.textContent !== (c ? c[2] : "")) sub.textContent = c ? c[2] : ""; sub.hidden = !c || presState !== "stage"; });
    video.addEventListener("ended", endIntro);
    video.play().catch(() => { if (!video || introDone) return; video.remove(); video = null; $("#ph").hidden = false; runPlaceholder(); });
  } else runPlaceholder();
}

function runPlaceholder(){
  const lines = [
    ["Welcome to my World", "I'm York, from Taipei Wego Senior High School"],
    ["Feel free to explore", "every app here is a part of my story"],
    ["Follow the little guide", "down below and it'll show you around"]
  ];
  const t0 = performance.now();
  let shown = -1;
  (function frame(now){
    if (introDone) return;
    const p = Math.min(1, (now - t0) / INTRO_MS);
    $("#prog").style.width = (p*100) + "%";
    const i = Math.min(lines.length-1, Math.floor(p * lines.length));
    if (i !== shown){ shown = i; $("#phText").innerHTML = `<div class="ph-line">${lines[i][0]}<span class="ph-small">${lines[i][1]}</span></div>`; }
    if (p < 1) requestAnimationFrame(frame); else endIntro();
  })(t0);
}

skipBtn.addEventListener("click", endIntro);

function endIntro(){
  if (introDone) return;
  introDone = true;
  store.set("yorkos_seen","1");
  if (video){ video.pause(); video.remove(); video = null; }
  $("#phSub").hidden = true;
  if (IDLE_VIDEO){
    $("#ph").hidden = true;
    idleVideo().hidden = false;
    playIdle();
  }
  skipBtn.hidden = true;
  $("#dim").classList.add("off");
  presState = "pip";
  presenter.classList.add("pip");
  layout();
  setTimeout(() => { bubbleOpen = true; showTip(); }, 650);
}

function layout(){
  const vw = innerWidth, vh = innerHeight;
  if (presState === "stage"){
    const w = vw < 640 ? vw - 32 : Math.min(vw * 0.75, vh * 0.8 * 16 / 9), h = w * 9 / 16;
    Object.assign(presenter.style,{ width:w+"px", height:h+"px", left:(vw-w)/2+"px", top:(vh-h)/2+"px", borderRadius:"18px" });
    Object.assign(skipBtn.style,{ right:((vw-w)/2)+"px", top:((vh-h)/2 + h + 14)+"px" });
    return;
  }
  const narrow = vw < 640;
  const k = appOpen ? 1 : Math.min(homeZ, 1.2);
  const size = (appOpen ? (narrow ? 58 : 76) : (narrow ? 78 : (vw >= 1000 ? 124 : 104))) * k;
  const bottomGap = (appOpen ? 18 : 26) * k;
  const left = vw - size - 18 * k, top = vh - size - bottomGap;
  Object.assign(presenter.style,{ width:size+"px", height:size+"px", left:left+"px", top:top+"px", borderRadius:"50%" });
  if (narrow){ bubble.style.right = "16px"; bubble.style.bottom = (vh - top + 10) + "px"; }
  else { bubble.style.right = (18 * k + size + 12) + "px"; bubble.style.bottom = (bottomGap + 6) + "px"; }
}
addEventListener("resize", layout);

function showTip(){
  document.querySelectorAll(".app-icon.hint").forEach(e => e.classList.remove("hint"));
  if (!introDone) return;
  const hideForLayer = !!document.querySelector(".modal-wrap, .player");
  if (!bubbleOpen || guideQuiet || hideForLayer || (appOpen === "music" || appOpen === "files" || appOpen === "camera" || appOpen === "mun" || appOpen === "weather")){ bubble.classList.add("off"); return; }
  if (appOpen === "maps"){
    $("#bText").textContent = "Click a blinking region to zoom in. Hover a pin to see the story."; $("#bCount").textContent = "Maps";
    $("#bPrev").hidden = $("#bNext").hidden = true;
  } else if (appOpen === "yorkflix"){
    $("#bText").textContent = FLIX_TIP; $("#bCount").textContent = "YorkFlix";
    $("#bPrev").hidden = $("#bNext").hidden = true;
  } else {
    const t = TIPS[tipIdx];
    $("#bText").textContent = t.text; $("#bCount").textContent = `${tipIdx+1} / ${TIPS.length}`;
    $("#bPrev").hidden = $("#bNext").hidden = false;
    if (!appOpen) document.querySelectorAll(`.app-icon[data-app="${t.app}"]`).forEach(e => e.classList.add("hint"));
  }
  bubble.classList.remove("off");
}
$("#bNext").addEventListener("click", () => { tipIdx = (tipIdx + 1) % TIPS.length; showTip(); });
$("#bPrev").addEventListener("click", () => { tipIdx = (tipIdx - 1 + TIPS.length) % TIPS.length; showTip(); });
$("#bHide").addEventListener("click", () => { bubbleOpen = false; showTip(); });
presenter.addEventListener("click", () => { if (presState === "pip"){ bubbleOpen = !bubbleOpen; showTip(); } });

/* ---------- apps ---------- */
// Open / close animation: apps zoom out of (and back into) the icon that opened them, the home screen blurs behind.
document.addEventListener("pointerdown", e => {
  const b = e.target.closest?.(".app-icon, .widget"); if (!b) return;
  const r = b.getBoundingClientRect();
  document.documentElement.style.setProperty("--ax", (r.left + r.width / 2) + "px");
  document.documentElement.style.setProperty("--ay", (r.top + r.height / 2) + "px");
}, true);
function hideApp(el){
  if (!el || el.hidden) return;
  document.body.classList.remove("in-app");
  el.classList.add("app-out");
  clearTimeout(el._outT);
  el._outT = setTimeout(() => { el.hidden = true; el.classList.remove("app-out"); }, 300);
}
function openApp(id){
  if (!introDone) return;
  document.querySelectorAll(".app-out").forEach(x => { clearTimeout(x._outT); x.classList.remove("app-out"); x.hidden = true; });
  if (["yorkflix","maps","music","files","camera","mun","weather"].includes(id)) document.body.classList.add("in-app");
  if (id === "yorkflix") return openFlix();
  if (id === "maps") return openMaps();
  if (id === "music") return openMusic();
  if (id === "files") return openFiles();
  if (id === "camera") return openCamera();
  if (id === "mun") return openMun();
  if (id === "weather") return openEco();
  const a = APPS[id];
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-label="${a.name}">
    <div class="glyph" style="background:${a.bg}">${a.svg}</div>
    <h2>${a.name}</h2><div class="soon">Coming soon</div>
    <p>${a.info}</p><button class="pill-btn">Back to home</button></div>`;
  const close = () => { wrap.remove(); advanceIf(id); };
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  wrap.querySelector(".pill-btn").addEventListener("click", close);
  $("#layer").append(wrap);
  wrap.querySelector(".pill-btn").focus();
}
function advanceIf(id){
  guideQuiet = false;
  if (TIPS[tipIdx].app === id){ tipIdx = (tipIdx + 1) % TIPS.length; }
  showTip();
}

  const svg = $("#mapStage svg"); svg.setAttribute("viewBox", M.vb.join(" "));
  const k = M.vb[2] / stagePx()[0];
  svg.style.setProperty("--k", k);
  M.k = k; applyPinScale();
  svg.querySelectorAll(".route-dot").forEach(c => c.setAttribute("r", 5*k));
  svg.querySelectorAll(".dist-label").forEach(t => t.setAttribute("font-size", 12*k));
  svg.querySelectorAll(".city").forEach(g => { g.querySelector("circle").setAttribute("r", 2.6*k); const t = g.querySelector("text"); t.setAttribute("font-size", 11.5*k); t.setAttribute("x", 5*k); t.setAttribute("y", 4*k); });
  positionChips(); if (!$("#mapTip").hidden && M.tipI != null) placeTip(M.tipI);
}
function toScreen(x, y){ const [W,H] = stagePx(); return [(x-M.vb[0])/M.vb[2]*W, (y-M.vb[1])/M.vb[3]*H]; }
function positionChips(){
  const box = $("#regionChips"); if (!box || !M) return; const [W,H] = stagePx();
  let lines = "";
  box.querySelectorAll("[data-go]").forEach(b => {
    const R = REGION[b.dataset.go]; const [ax,ay] = toScreen(...MP(R.at[0], R.at[1])), [tx,ty] = toScreen(...MP(R.to[0], R.to[1]));
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let left = R.side === "nw" ? ax - bw : R.side === "ne" ? ax : ax - bw/2, top = R.side ? ay - bh : ay - bh/2;
    left = Math.max(8, Math.min(W - bw - 70, left)); top = Math.max(8, Math.min(H - bh - 8, top));
    b.style.left = left + "px"; b.style.top = top + "px";
    // leader from the nearest edge of the label to the area
    const cx = Math.max(left, Math.min(left + b.offsetWidth, tx)), cy = Math.max(top, Math.min(top + b.offsetHeight, ty));
    const v = M.vb, k = v[2]/W, mx = sx => v[0] + sx*k, my = sy => v[1] + sy*k, [gx,gy] = MP(R.to[0], R.to[1]);
    lines += `<line x1="${mx(cx)}" y1="${my(cy)}" x2="${gx}" y2="${gy}"/><circle cx="${gx}" cy="${gy}" r="${4.5*k}"/>`;
  });
  $("#mapStage svg .leaders").innerHTML = lines;
}
function showTipFor(i, sticky){
  clearTimeout(M.tipTimer); M.tipI = i; M.tipSticky = !!sticky;
  const p = LEVELS[M.level].pins[i], tip = $("#mapTip");
  tip.innerHTML = `<div class="mt-photo" style="--c:${p.color}">${p.photo ? `<img src="${p.photo}" alt="${p.name}">` : `<span>Photo coming soon</span>`}</div>
    <div class="mt-body"><div class="mt-tag" style="color:${p.color}">${p.tag}</div><h3>${p.name}</h3><p>${p.text}</p>
    ${p.link ? `<a href="${p.link.href}" target="_blank" rel="noopener">${p.link.label} ↗</a>` : ""}</div>`;
  tip.hidden = false; placeTip(i);

}
function hideTipSoon(){ if (M.tipSticky) return; clearTimeout(M.tipTimer); $("#mapTip").hidden = true; M.tipI = null; }
function placeTip(i){
  const p = LEVELS[M.level].pins[i], tip = $("#mapTip"), [W,H] = stagePx();
  const [x,y] = MP(p.lon,p.lat), [sx,sy] = toScreen(x,y);
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const ph = 34 * (innerWidth >= 1280 && innerHeight >= 760 ? 1.45 : 1);  // pin height on screen
  let left = sx - tw/2, top = sy - ph - th - 8;
  if (top < 8) top = sy + 10;
  if (top + th > H - 8 && sy - ph - th - 8 < 8){  // no room above or below: sit beside the pin
    left = sx + 22 + tw < W - 8 ? sx + 22 : sx - 22 - tw; top = sy - ph/2 - th/2;
  }
  left = Math.max(8, Math.min(W - tw - 8, left)); top = Math.max(8, Math.min(H - th - 8, top));
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function zoomAt(f, cx, cy){
  const v = M.vb, ax = cx ?? v[0]+v[2]/2, ay = cy ?? v[1]+v[3]/2;
  M.vb = [ax-(ax-v[0])*f, ay-(ay-v[1])*f, v[2]*f, v[3]*f]; applyVB();
}
function evToMap(ev){ const r = $("#mapStage").getBoundingClientRect(); return [M.vb[0]+(ev.clientX-r.left)/r.width*M.vb[2], M.vb[1]+(ev.clientY-r.top)/r.height*M.vb[3]]; }
function initGestures(st){
  const ptrs = new Map(); let last = null, pinch = null;
  st.addEventListener("wheel", e => { if (M.anim) return; e.preventDefault(); const [x,y] = evToMap(e); zoomAt(Math.exp(e.deltaY*0.0015), x, y); }, { passive:false });
  st.addEventListener("pointerdown", e => { if (e.target.closest(".map-tip, .region-chip")) return; ptrs.set(e.pointerId, e); M.dragged = false; last = { x:e.clientX, y:e.clientY };
    if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); } });
  st.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId) || M.anim) return; ptrs.set(e.pointerId, e);
    const r = st.getBoundingClientRect();
    if (ptrs.size === 2){ const [a,b] = [...ptrs.values()], d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if (pinch){ const [x,y] = evToMap({ clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2 }); zoomAt(pinch/d, x, y); } pinch = d; M.dragged = true; return; }
    const dx = e.clientX-last.x, dy = e.clientY-last.y;
    if (!M.dragged && Math.abs(dx)+Math.abs(dy) > 5){ M.dragged = true; st.setPointerCapture?.(e.pointerId); }
    if (M.dragged){ M.vb[0] -= dx/r.width*M.vb[2]; M.vb[1] -= dy/r.height*M.vb[3]; last = { x:e.clientX, y:e.clientY }; applyVB(); }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; setTimeout(() => { if (!ptrs.size) M.dragged = false; }, 0); };
  st.addEventListener("pointerup", up); st.addEventListener("pointercancel", up);
  st.addEventListener("click", e => { if (!e.target.closest(".pin, .map-tip") && !M.dragged){ M.tipSticky = false; $("#mapTip").hidden = true; } });
}
function stopXY(p){ return typeof p === "string" ? MP(STOPS[p][0], STOPS[p][1]) : MP(p[0], p[1]); }
function playRoute(which){
  quietGuide();
  const R = ROUTES[which], g = $("#mapStage svg .route");
  $("#routeBar").querySelectorAll("[data-route]").forEach(b => b.classList.toggle("on", b.dataset.route === which));
  $("#mapTip").hidden = true;
  let s = "", all = [];
  R.legs.forEach((leg,i) => { const pts = leg.pts.map(stopXY); all.push(...pts);
    s += `<polyline class="route-leg" vector-effect="non-scaling-stroke" points="${pts.map(p=>p.join(",")).join(" ")}" stroke="${leg.color}" style="animation-delay:${.5+i*1.1}s"/>`; });
  const stops = new Set(); R.legs.forEach(l => l.pts.forEach(p => typeof p === "string" && stops.add(p)));
  stops.forEach(k => { const [x,y] = stopXY(k); s += `<circle class="route-dot" cx="${x}" cy="${y}" r="1"/>`; });
  g.innerHTML = s;
  g.querySelectorAll(".route-leg").forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  const narrow = stagePx()[0] < 700;
  animateTo(fitBox([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], .15, narrow ? 0 : $("#routeBar").offsetWidth + 40), 900);
  const first = R.legs[0].pts[0];
  $("#routeSteps").innerHTML = `<ol>${R.legs.map((l,i) => { const to = l.pts[l.pts.length-1];
    return `<li style="animation-delay:${.5+i*1.1}s"><i style="background:${l.color}"></i><span><b>${l.mode}</b><br>${i===0 ? STOPS[first][2] + " → " : ""}${STOPS[to][2]}</span></li>`; }).join("")}</ol>`;
}

// accepts a full YouTube link or just the video ID
function ytId(v){ const m = String(v).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : v; }
// accepts "1:25" or 85
function toSec(t){ return String(t).split(":").reduce((a, n) => a * 60 + Number(n), 0); }

// YouTube episode rows
function ytUrl(e){ return `https://www.youtube.com/watch?v=${e.yt}${e.t ? "&t=" + e.t + "s" : ""}`; }
function epRow(s, e, i){
  return `<a class="vep" href="${ytUrl(e)}" target="_blank" rel="noopener">
    <b>${i+1}</b>
    <span class="vthumb">${art(s, true)}<img src="${e.cover || `https://i.ytimg.com/vi/${e.yt}/hqdefault.jpg`}" alt="" loading="lazy" onerror="this.remove()"><i>${ICON_PLAY}</i></span>
    <span class="vtxt"><strong>${e.title}</strong>${e.note ? `<em>${e.note}</em>` : ""}<small>${e.len ? e.len + " · " : ""}Watch on YouTube ↗</small></span></a>`;
}
function playBtn(s){
  if (s.trailer) return `<button class="btn-play" data-play="${s.id}">${ICON_PLAY}Play Trailer</button>`;
  const v = (s.episodes || []).find(e => typeof e === "object");
  if (v) return `<a class="btn-play" href="${ytUrl(v)}" target="_blank" rel="noopener">${ICON_PLAY}${s.episodes.filter(e => typeof e === "object").length > 1 ? "Watch Episode 1" : "Watch Now"}</a>`;
  return `<button class="btn-play" data-play="${s.id}">${ICON_PLAY}Play Trailer</button>`;
}

function openPlayer(id){
  const s = byId(id);
  const p = document.createElement("div");
  p.className = "player";
  let media;
  if (/\.mp4$/i.test(s.trailer)) media = `<video src="${s.trailer}" controls autoplay playsinline></video>`;
  else if (s.trailer) media = `<iframe src="https://www.youtube-nocookie.com/embed/${ytId(s.trailer)}?autoplay=1&rel=0&modestbranding=1${s.start ? "&start=" + toSec(s.start) : ""}${s.end ? "&end=" + toSec(s.end) : ""}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${s.title} trailer"></iframe>`;
  else media = `<div class="soon-trailer">${art(s, true)}<div class="veil"></div><div class="msg"><h3>${s.title}</h3><p>Trailer coming soon</p></div><div class="scrub"><i></i></div></div>`;
  p.innerHTML = `<div class="player-top"><button aria-label="Back">${ICON_BACK}Back</button><span>${s.title} · Trailer</span></div>
    <div class="player-stage"><div class="screen16">${media}</div></div>`;
  p.querySelector("button").addEventListener("click", closePlayer);
  $("#layer").append(p);
  presenter.classList.add("away");
  showTip();
  p.querySelector("button").focus();
}
function closePlayer(){ document.querySelector(".player")?.remove(); presenter.classList.remove("away"); showTip(); }

// Long clips can be stored as several byte-chunks of one fragmented MP4 and streamed back together.
function muMSE(v, t){
  const ms = new MediaSource(), token = {}; MU.load = token;
  v.src = URL.createObjectURL(ms);

    const sb = ms.addSourceBuffer(t.mime || 'video/mp4; codecs="avc1.640029, mp4a.40.2"');
    try { ms.duration = t.dur; } catch(e){}
    for (let k = 0; k < t.parts; k++){

      const buf = await (await fetch(`music/${t.id}-p${k}.mp4`)).arrayBuffer();
      if (MU.load !== token || ms.readyState !== "open") return;
      await new Promise(r => { sb.addEventListener("updateend", r, { once:true }); sb.appendBuffer(buf); });

function bDecoTitle(ctx, t){
