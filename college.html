<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>York's World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-screen tablet OS — power on → 15s welcome video → shrinks to corner guide → home screen; apps open as full-screen layers */
:root{
  --black:#050507;
  --white:#f5f5f7;
  --muted:#a6a6b0;
  --line:rgba(255,255,255,.14);
  --glass:rgba(16,24,28,.40);
  --panel:#18181b;
  --flix-bg:#0e0e10;
  --flix-red:#d7262f;
  --flix-gold:#f2c14e;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--black);color:var(--white);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Boot ---------- */
#boot{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,3.2vh,44px);transition:opacity .7s ease}
#boot.off{opacity:0;pointer-events:none}
.boot-name{font-family:var(--display);font-size:clamp(34px,5.2vw,96px);letter-spacing:.08em;line-height:1}
.power{width:clamp(96px,10vw,190px);height:clamp(96px,10vw,190px);border-width:2px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;animation:breathe 2.6s ease-in-out infinite;transition:transform .2s}
.power:hover{transform:scale(1.05)}
.power svg{width:38%;height:38%}
.boot-label{font-size:clamp(12px,1.15vw,20px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}

/* ---------- Home screen ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(20px,env(safe-area-inset-left,0px));
  background:
    radial-gradient(60% 50% at 85% 8%, rgba(242,170,74,.55), transparent 70%),
    radial-gradient(55% 55% at 8% 95%, rgba(196,58,88,.50), transparent 70%),
    radial-gradient(70% 60% at 50% 50%, #12404a, transparent 80%),
    #0b2229;}
.statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;padding:4px 6px;font-variant-numeric:tabular-nums}
.status-right{display:flex;gap:8px;align-items:center}
.battery{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.85);border-radius:3px;padding:1.5px;position:relative}
.battery::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.85);border-radius:0 1px 1px 0}
.battery i{display:block;height:100%;width:82%;background:#fff;border-radius:1px}
.home-main{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding-block:20px}
.springboard{width:min(900px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center}
.widgets{display:flex;flex-direction:column;gap:16px;min-width:0}
.widget{border-radius:26px;padding:20px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);text-align:left;width:100%}
.hello{display:flex;gap:16px;align-items:center}
.avatar{flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;letter-spacing:.04em;background:linear-gradient(140deg,#f2aa4a,#c43a58);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.hello h1{margin:0;font-size:22px;letter-spacing:-.01em}
.hello p{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.12);letter-spacing:.02em}
.photos{padding:0;overflow:hidden;position:relative;aspect-ratio:4/3;cursor:pointer;display:block}
.photos .slide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1s ease,transform 6s ease}
.photos .slide.on{opacity:1;transform:scale(1)}
.photos .slide img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.slide.ph-photo{background:linear-gradient(150deg,var(--a),var(--b));display:grid;place-items:center;align-content:center;gap:8px;font-size:12px;color:rgba(255,255,255,.7)}
.ph-photo svg{width:46px;height:46px;opacity:.5}
.photos .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 45%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 28%)}
.p-label{position:absolute;left:18px;top:15px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.p-dots{position:absolute;right:18px;top:19px;display:flex;gap:5px}
.p-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s}
.p-dots i.on{background:#fff}
.p-cap{position:absolute;left:18px;right:18px;bottom:15px;transition:opacity .4s}
.p-cap b{display:block;font-size:18px}
.p-cap span{font-size:12.5px;color:rgba(255,255,255,.82)}
.nowshowing > *{transition:opacity .4s}
.nowshowing.swap > *{opacity:0}
.nowshowing{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .2s}
.nowshowing:hover{transform:translateY(-2px)}
.nowshowing .mini{flex:0 0 74px;aspect-ratio:2/3;border-radius:8px;overflow:hidden}
.ns-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--flix-red);font-weight:700}
.ns-title{font-size:18px;font-weight:700;margin-top:4px}
.ns-sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:4px;line-height:1.4}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(26px,calc(3 * var(--vw,1vw)),40px) clamp(10px,calc(1.4 * var(--vw,1vw)),22px)}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:clamp(12px,calc(1.05 * var(--vw,1vw)),15px);font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.glyph{width:clamp(60px,calc(6.6 * var(--vw,1vw)),98px);max-width:100%;aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.28);transition:transform .18s;position:relative}
.yf-logo{width:66%!important;height:66%!important;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.glyph svg{width:58%;height:58%}
.app-icon:hover .glyph{transform:translateY(-2px)}
.app-icon:active .glyph{transform:scale(.9)}
.app-icon.hint .glyph{animation:hint 1.5s ease-out infinite}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75),0 8px 18px rgba(0,0,0,.28)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0),0 8px 18px rgba(0,0,0,.28)}}
.yf-glyph{font-family:var(--display);color:var(--flix-red);font-size:44px;line-height:1;transform:translateY(1px)}
.dock{align-self:center;display:flex;gap:clamp(14px,calc(1.8 * var(--vw,1vw)),26px);padding:clamp(10px,calc(1.2 * var(--vw,1vw)),16px) clamp(14px,calc(1.6 * var(--vw,1vw)),22px);border-radius:clamp(26px,calc(2.6 * var(--vw,1vw)),38px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);max-width:100%}
.dock .app-icon span{display:none}
.dock .glyph{width:clamp(56px,calc(6.4 * var(--vw,1vw)),92px)}
@media (min-width:1000px){
  .springboard{width:min(1240px,100%);gap:56px}
  .statusbar{font-size:15px;padding:6px 10px}
  .widgets{gap:22px}
  .widget{border-radius:30px}
  .nowshowing{padding:22px;gap:20px}
  .nowshowing .mini{flex-basis:100px}
  .ns-label{font-size:12px}
  .ns-title{font-size:22px}
  .ns-sub{font-size:14.5px}
  .p-label{font-size:12px;left:22px;top:18px}
  .p-dots{right:22px;top:22px}
  .p-cap{left:22px;right:22px;bottom:20px}
  .p-cap b{font-size:23px}
  .p-cap span{font-size:14.5px}
}

@media (max-width:720px){
  .springboard{grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
  .home-main{align-items:flex-start}
  .glyph{width:60px}
  .dock{gap:12px;padding:10px 12px}
  .dock .glyph{width:54px}
}

/* wallpaper layers */
.statusbar,.home-main,.dock{position:relative;z-index:1}
.wall-photo{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.15);opacity:.55}
.wall-photo[hidden]{display:none}
.wall-type{position:absolute;left:50%;transform:translateX(-50%);bottom:-5vw;font-family:var(--display);font-size:calc(36 * var(--vw,1vw));line-height:.8;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.09);pointer-events:none;user-select:none;white-space:nowrap}

/* three-column springboard */
.widgets.right{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media (min-width:1000px){
  .springboard{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.95fr);align-items:center}
  .widgets.right{grid-column:auto;display:flex;flex-direction:column;gap:22px}
}
@media (max-width:720px){.widgets.right{grid-template-columns:minmax(0,1fr)}}
.w-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7)}

.clock{display:flex;align-items:center;gap:16px}
.dial{flex:0 0 auto;width:clamp(60px,calc(6 * var(--vw,1vw)),84px);height:auto}
.c-time{font-size:clamp(22px,calc(2.1 * var(--vw,1vw)),30px);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.c-line{font-size:13px;color:rgba(255,255,255,.78);line-height:1.4;margin-top:2px}

.pod{display:flex;gap:16px;align-items:center;color:inherit;text-decoration:none;transition:transform .2s;flex-wrap:wrap}
.pod:hover{transform:translateY(-2px)}
.pod-cover{flex:0 0 auto;width:clamp(72px,calc(6.6 * var(--vw,1vw)),96px);aspect-ratio:1;border-radius:14px;object-fit:cover;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.pod-body{flex:1 1 140px;min-width:0}
.pod-name{font-size:clamp(17px,calc(1.5 * var(--vw,1vw)),20px);font-weight:700;margin-top:3px}
.pod-sub{font-size:13px;color:rgba(255,255,255,.78);line-height:1.4;margin-top:3px}
.pod-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.pod-play{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:7px 13px 7px 10px;border-radius:99px;background:#fff;color:#111}
.pod-play svg{width:14px;height:14px}
.pod-eps{font-size:12.5px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}

.note{position:relative;text-align:left;padding:26px 24px 18px;border-radius:6px;transform:rotate(-1.6deg);color:#1b1b24;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(70,110,200,.16) 27px 28px) 0 18px/100% auto,#f9f9f6;
  box-shadow:0 14px 30px rgba(0,0,0,.35);border:0;transition:transform .25s}
.note::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1.5px;background:rgba(214,60,80,.35)}
.note::after{content:"";position:absolute;left:50%;top:-11px;width:92px;height:24px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.note:hover{transform:rotate(-.6deg) translateY(-2px)}
.note.flip{animation:flip .5s ease}
@keyframes flip{50%{transform:rotate(-1.6deg) rotateY(90deg)}}
.note .q{font-family:"Permanent Marker","Comic Sans MS",cursive;font-size:clamp(17px,calc(1.55 * var(--vw,1vw)),21px);line-height:1.35;margin:0 0 10px 10px;text-wrap:balance}
.note .by{font-family:"Caveat","Segoe Print",cursive;font-size:clamp(17px,calc(1.5 * var(--vw,1vw)),20px);color:#c43a58;margin:0 0 0 10px;line-height:1.2}
.note .tap{position:absolute;right:14px;bottom:8px;font-family:"Caveat",cursive;font-size:14px;color:#8a8a96}

/* dim layer while the welcome video plays */
#dim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .6s}
#dim.off{opacity:0;pointer-events:none}

/* ---------- Presenter (welcome video → corner guide) ---------- */
#presenter{position:fixed;z-index:85;overflow:hidden;background:#111;box-shadow:0 30px 80px rgba(0,0,0,.55);
  transition:left .7s cubic-bezier(.65,0,.25,1),top .7s cubic-bezier(.65,0,.25,1),width .7s cubic-bezier(.65,0,.25,1),height .7s cubic-bezier(.65,0,.25,1),border-radius .7s,opacity .3s}
#presenter[hidden]{display:none}
#presenter.pip{cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.85)}
#presenter.away{opacity:0;pointer-events:none}
#presenter video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:radial-gradient(80% 90% at 70% 20%,rgba(242,170,74,.5),transparent 60%),radial-gradient(70% 80% at 10% 100%,rgba(196,58,88,.55),transparent 60%),#0d2a31}
.ph-tag{position:absolute;left:14px;top:12px;font-size:clamp(11px,.9vw,15px);letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.45);padding:5px 9px;border-radius:6px;color:rgba(255,255,255,.8)}
.ph-line{font-family:var(--display);font-size:clamp(28px,5.4vw,110px);letter-spacing:.02em;line-height:1.05;padding:0 24px;text-wrap:balance;animation:lineIn .7s ease both}
.ph-small{display:block;font-family:var(--ui);font-size:clamp(13px,1.6vw,28px);letter-spacing:.02em;margin-top:10px;color:rgba(255,255,255,.8);font-weight:500}
@keyframes lineIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph-avatar{display:none;font-family:var(--display);font-size:32px;letter-spacing:.04em}
#presenter.pip .ph-tag,#presenter.pip .ph-text,#presenter.pip .prog{display:none}
#presenter.pip .ph-avatar{display:block}
.prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--white);opacity:.85}
#skip{position:fixed;z-index:86;font-size:clamp(13px,1vw,18px);font-weight:600;padding:.6em 1.1em;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--line)}
#skip:hover{background:rgba(255,255,255,.26)}

#bubble{position:fixed;z-index:84;width:min(300px,calc(calc(100 * var(--vw,1vw)) - 32px));padding:14px 16px 12px;border-radius:18px;background:rgba(250,250,252,.96);color:#141418;box-shadow:0 14px 34px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
#bubble.off{opacity:0;transform:translateY(8px);pointer-events:none}
.b-who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c43a58}
.b-text{margin:6px 0 10px;font-size:15px;line-height:1.45;font-weight:500}
.b-row{display:flex;align-items:center;gap:6px}
.b-count{font-size:12px;color:#6b6b75;margin-right:auto;font-variant-numeric:tabular-nums}
.b-btn{width:30px;height:30px;border-radius:50%;background:#ececf0;display:grid;place-items:center;font-size:16px;color:#141418}
.b-btn:hover{background:#dedee4}
.b-btn:focus-visible{outline-color:#141418}

/* ---------- Coming-soon sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
.sheet{width:min(400px,100%);border-radius:24px;padding:26px;background:rgba(28,30,34,.92);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);text-align:center;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet .glyph{margin:0 auto 14px;width:76px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .soon{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--flix-gold);font-weight:700}
.sheet p{color:rgba(255,255,255,.78);line-height:1.5;font-size:14.5px;margin:12px 0 20px}
.pill-btn{padding:10px 22px;border-radius:99px;background:var(--white);color:#111;font-weight:700;font-size:14px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* ---------- YorkFlix ---------- */
#app{position:fixed;inset:0;z-index:60;background:var(--flix-bg);overflow-y:auto;overflow-x:hidden;animation:appIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:scale(.94)}}
.flix-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(24px,env(safe-area-inset-right,0px)) 14px max(24px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--flix-bg) 35%,rgba(14,14,16,0))}
.wordmark{font-family:var(--display);color:var(--flix-red);font-size:30px;letter-spacing:.03em;line-height:1}
.flix-nav{display:flex;gap:18px;font-size:14px}
.flix-nav button{color:rgba(255,255,255,.72)}
.flix-nav button:hover{color:#fff}
.close-app{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 14px 8px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.close-app:hover{background:rgba(255,255,255,.2)}
.close-app svg{width:16px;height:16px}
@media (max-width:620px){.flix-nav{display:none}.wordmark{font-size:26px}}

.gate{min-height:calc(100% - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px 24px 80px;text-align:center}
.gate h2{margin:0;font-size:clamp(28px,calc(4.5 * var(--vw,1vw)),44px);font-weight:600;letter-spacing:-.01em}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:26px}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:15px;width:120px}
.profile .pf{width:110px;height:110px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:40px;color:#fff;transition:box-shadow .15s,transform .15s}
.profile .pf svg{width:50%;height:50%}
.profile:hover{color:#fff}
.profile:hover .pf{box-shadow:0 0 0 3px #fff;transform:translateY(-2px)}
@media (max-width:480px){.profile{width:96px}.profile .pf{width:88px;height:88px;font-size:32px}}

.hero{position:relative;min-height:min(calc(72 * var(--vh,1vh)),580px);display:flex;align-items:flex-end;margin-top:-70px}
.hero > .art{position:absolute;inset:0}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,14,16,.92) 0%,rgba(14,14,16,.55) 45%,rgba(14,14,16,0) 75%),linear-gradient(0deg,var(--flix-bg) 0%,rgba(14,14,16,0) 35%)}
.hero-body{position:relative;padding:110px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));max-width:620px}
.greet{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:14px}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.85)}
.kicker b{font-family:var(--display);color:var(--flix-red);font-size:20px;letter-spacing:0;font-weight:400}

const GRID_APPS = ["yorkflix","maps","weather","camera","music","files","settings","flashlight"];
const IS_LIVE = /github\.io$/.test(location.hostname); // hides "placeholder" labels on the real site

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const byId = id => SHOWS.find(s => s.id === id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>`;
const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const ICON_HOME = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const ICON_TROPHY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v2H8v-2h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.3 1.9A5 5 0 0 1 7 8zm10 0v1a5 5 0 0 1-.3 1.9A2 2 0 0 0 18 8V7z"/></svg>`;

function art(s, wide){

}
function iconHTML(id){

/* ---------- home ---------- */
$("#grid").innerHTML = GRID_APPS.map(iconHTML).join("");

document.querySelectorAll(".app-icon").forEach(b => b.addEventListener("click", () => openApp(b.dataset.app)));

/* photo widget */
const ICON_PHOTO = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>`;
const pw = $("#photoWidget");
pw.insertAdjacentHTML("afterbegin", PHOTOS.map(p => p.src

$("#pDots").innerHTML = PHOTOS.map(() => "<i></i>").join("");
let photoIdx = -1, photoTimer;
function showPhoto(i){
  photoIdx = (i + PHOTOS.length) % PHOTOS.length;
  pw.querySelectorAll(".slide").forEach((s,k) => s.classList.toggle("on", k === photoIdx));
  $("#pDots").querySelectorAll("i").forEach((d,k) => d.classList.toggle("on", k === photoIdx));

showPhoto(0);
pw.addEventListener("click", () => showPhoto(photoIdx + 1));

/* now-showing widget */
let nsIdx = 0;
setInterval(() => {

  const s = byId(NOW_SHOWING[nsIdx]), w = $("#nowShowing");
  w.classList.add("swap");
  setTimeout(() => {
    $("#nsArt").innerHTML = art(s);
    $("#nsTitle").textContent = `${s.title} · ${s.season}`;
    $("#nsSub").textContent = s.award || `${s.networkFull} · ${s.year}`;

/* wallpaper */
if (WALLPAPER){ const wp = $("#wallPhoto"); wp.style.backgroundImage = `url("${WALLPAPER}")`; wp.hidden = false; }

/* clock widget (always Taipei time) */
$("#ticks").innerHTML = Array.from({length:12},(_,i)=>`<line x1="50" y1="8" x2="50" y2="${i%3?13:16}" stroke="#141418" stroke-width="${i%3?1.4:2.4}" stroke-linecap="round" transform="rotate(${i*30} 50 50)"/>`).join("");
const tpeFmt = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:false});
function taipeiClock(){
  const parts = Object.fromEntries(tpeFmt.formatToParts(new Date()).map(p => [p.type, p.value]));
  const h = (+parts.hour) % 24, m = +parts.minute, s = +parts.second;
  $("#hh").setAttribute("transform",`rotate(${(h%12)*30 + m*.5} 50 50)`);
  $("#mh").setAttribute("transform",`rotate(${m*6 + s*.1} 50 50)`);
  $("#sh").setAttribute("transform",`rotate(${s*6} 50 50)`);
  const h12 = h % 12 || 12, ap = h < 12 ? "AM" : "PM";
  $("#cTime").textContent = `${h12}:${String(m).padStart(2,"0")} ${ap}`;
  const diff = 8 + new Date().getTimezoneOffset()/60;
  const rel = diff === 0 ? "Same time zone as you." : `${Math.abs(diff)} hour${Math.abs(diff)===1?"":"s"} ${diff>0?"ahead of":"behind"} you.`;
  $("#cLine").textContent = `It's ${h12}:${String(m).padStart(2,"0")} ${ap} in Taipei, where I am. ${rel}`;
}
taipeiClock(); setInterval(taipeiClock, 1000);

/* podcast widget */
$("#pod").href = PODCAST.url;
$("#podCover").src = PODCAST.cover;
$("#podName").textContent = PODCAST.name;
$("#podSub").textContent = PODCAST.sub;
$("#podEps").textContent = PODCAST.episodes;

/* handwritten note */
let quoteIdx = 0;
function showQuote(){ $("#noteQ").textContent = QUOTES[quoteIdx].q; $("#noteBy").textContent = "— " + QUOTES[quoteIdx].by; }
showQuote();
$("#note").addEventListener("click", () => {
  const n = $("#note"); n.classList.remove("flip"); void n.offsetWidth; n.classList.add("flip");
  setTimeout(() => { quoteIdx = (quoteIdx + 1) % QUOTES.length; showQuote(); }, 250);

/* scale the home screen to fill large screens (designed at 1480 x 880) */
const homeEl = $("#home"), homeScale = $("#homeScale");
let homeZ = 1;
function fitHome(){
  const iw = homeEl.clientWidth || innerWidth, ih = homeEl.clientHeight || innerHeight;
  homeZ = iw >= 1000 ? Math.max(1, Math.min(iw / 1480, ih / 880)) : 1;
  const w = iw / homeZ, h = ih / homeZ;
  Object.assign(homeScale.style, { width:w+"px", height:h+"px", transform:`scale(${homeZ})` });
  homeScale.style.setProperty("--vw", (w/100)+"px");
  homeScale.style.setProperty("--vh", (h/100)+"px");
}
fitHome();
addEventListener("resize", fitHome);

function tick(){
  const d = new Date();
  $("#clock").textContent = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/,"");
  $("#dateMini").textContent = d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
tick(); setInterval(tick, 20000);

/* ---------- boot + presenter ---------- */
const presenter = $("#presenter"), bubble = $("#bubble"), skipBtn = $("#skip");
let presState = "stage", introDone = false, tipIdx = 0, bubbleOpen = true, appOpen = null, video = null;

$("#powerBtn").addEventListener("click", startIntro);

function startIntro(){
  $("#boot").classList.add("off");
  $("#dim").classList.remove("off");
  presenter.hidden = false;
  presenter.querySelector(".ph-tag").hidden = IS_LIVE;
  presState = "stage"; layout();
  if (store.get("yorkos_seen") === "1"){ skipBtn.hidden = false; }
  if (WELCOME_VIDEO){
    $("#ph").hidden = true;
    video = document.createElement("video");
    video.src = WELCOME_VIDEO; video.playsInline = true;
    presenter.prepend(video);
    video.addEventListener("timeupdate", () => { if (video.duration) $("#prog").style.width = (video.currentTime/video.duration*100)+"%"; });
    video.addEventListener("ended", endIntro);
    video.play().catch(() => { video.remove(); video = null; $("#ph").hidden = false; runPlaceholder(); });
  } else runPlaceholder();
}

function runPlaceholder(){
  const lines = [
    ["Welcome to my world", "I'm York Chen"],
    ["Host. Podcaster. Delegate.", "and a few more things"],
    ["Let me show you around", "Tap the apps to explore"]
  ];
  const t0 = performance.now();
  let shown = -1;
  (function frame(now){
    if (introDone) return;
    const p = Math.min(1, (now - t0) / INTRO_MS);
    $("#prog").style.width = (p*100) + "%";
    const i = Math.min(lines.length-1, Math.floor(p * lines.length));
    if (i !== shown){ shown = i; $("#phText").innerHTML = `<div class="ph-line">${lines[i][0]}<span class="ph-small">${lines[i][1]}</span></div>`; }
    if (p < 1) requestAnimationFrame(frame); else endIntro();
  })(t0);
}

skipBtn.addEventListener("click", endIntro);

function endIntro(){
  if (introDone) return;
  introDone = true;
  store.set("yorkos_seen","1");
  if (video) video.pause();
  skipBtn.hidden = true;
  $("#dim").classList.add("off");
  presState = "pip";
  presenter.classList.add("pip");
  layout();
  setTimeout(() => { bubbleOpen = true; showTip(); }, 650);
}

function layout(){
  const vw = innerWidth, vh = innerHeight;
  if (presState === "stage"){
    const w = vw < 640 ? vw - 32 : Math.min(vw * 0.75, vh * 0.8 * 16 / 9), h = w * 9 / 16;
    Object.assign(presenter.style,{ width:w+"px", height:h+"px", left:(vw-w)/2+"px", top:(vh-h)/2+"px", borderRadius:"18px" });
    Object.assign(skipBtn.style,{ right:((vw-w)/2)+"px", top:((vh-h)/2 + h + 14)+"px" });
    return;
  }
  const narrow = vw < 640;
  const k = appOpen ? 1 : Math.min(homeZ, 1.2);
  const size = (appOpen ? (narrow ? 58 : 76) : (narrow ? 78 : (vw >= 1000 ? 124 : 104))) * k;
  const bottomGap = (appOpen ? 18 : 26) * k;
  const left = vw - size - 18 * k, top = vh - size - bottomGap;
  Object.assign(presenter.style,{ width:size+"px", height:size+"px", left:left+"px", top:top+"px", borderRadius:"50%" });
  if (narrow){ bubble.style.right = "16px"; bubble.style.bottom = (vh - top + 10) + "px"; }
  else { bubble.style.right = (18 * k + size + 12) + "px"; bubble.style.bottom = (bottomGap + 6) + "px"; }
}
addEventListener("resize", layout);

function showTip(){
  document.querySelectorAll(".app-icon.hint").forEach(e => e.classList.remove("hint"));
  if (!introDone) return;
  const hideForLayer = !!document.querySelector(".modal-wrap, .player");
  if (!bubbleOpen || hideForLayer){ bubble.classList.add("off"); return; }
  if (appOpen === "yorkflix"){
    $("#bText").textContent = FLIX_TIP; $("#bCount").textContent = "YorkFlix";
    $("#bPrev").hidden = $("#bNext").hidden = true;
  } else {
    const t = TIPS[tipIdx];
    $("#bText").textContent = t.text; $("#bCount").textContent = `${tipIdx+1} / ${TIPS.length}`;
    $("#bPrev").hidden = $("#bNext").hidden = false;
    if (!appOpen) document.querySelectorAll(`.app-icon[data-app="${t.app}"]`).forEach(e => e.classList.add("hint"));
  }
  bubble.classList.remove("off");
}
$("#bNext").addEventListener("click", () => { tipIdx = (tipIdx + 1) % TIPS.length; showTip(); });
$("#bPrev").addEventListener("click", () => { tipIdx = (tipIdx - 1 + TIPS.length) % TIPS.length; showTip(); });
$("#bHide").addEventListener("click", () => { bubbleOpen = false; showTip(); });
presenter.addEventListener("click", () => { if (presState === "pip"){ bubbleOpen = !bubbleOpen; showTip(); } });

/* ---------- apps ---------- */
function openApp(id){
  if (!introDone) return;
  if (id === "yorkflix") return openFlix();
  const a = APPS[id];
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-label="${a.name}">
    <div class="glyph" style="background:${a.bg}">${a.svg}</div>
    <h2>${a.name}</h2><div class="soon">Coming soon</div>
    <p>${a.info}</p><button class="pill-btn">Back to home</button></div>`;
  const close = () => { wrap.remove(); advanceIf(id); };
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  wrap.querySelector(".pill-btn").addEventListener("click", close);
  $("#layer").append(wrap);
  wrap.querySelector(".pill-btn").focus();
}
function advanceIf(id){
  if (TIPS[tipIdx].app === id){ tipIdx = (tipIdx + 1) % TIPS.length; }
  showTip();
}

/* ---------- YorkFlix ---------- */
const appEl = $("#app");
let profile = null;

function openFlix(){
  appOpen = "yorkflix"; appEl.hidden = false; layout(); showTip();
  renderFlix();
}
function closeFlix(){
  appEl.hidden = true; appOpen = null; layout(); advanceIf("yorkflix");
}
function topBar(nav){
  return `<header class="flix-top"><span class="wordmark">YORKFLIX</span>
    ${nav ? `<nav class="flix-nav"><button data-jump="0">Home</button><button data-jump="1">Network TV</button><button data-jump="3">Made by York</button></nav>` : ""}
    <button class="close-app" id="flixClose">${ICON_HOME}Close</button></header>`;
}
function renderFlix(){
  if (!profile){
    const ico = d => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const profs = [
      ["Admissions Officer","#d7262f", ico(`<path d="M2 9.5 12 4.5l10 5-10 5z"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9.5v6"/>`)],
      ["Curious Guest","#1f8ac0", ico(`<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/>`)],
      ["Classmates & Friends","#c99a1f", ico(`<path d="M6 9.5a6 6 0 0 1 12 0V19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M9.5 3.8V5M14.5 3.8V5"/><rect x="9" y="13.5" width="6" height="4" rx="1"/>`)]
    ];
    appEl.innerHTML = topBar(false) + `<section class="gate"><h2>Who's watching?</h2><div class="profiles">
      ${profs.map(p => `<button class="profile" data-name="${p[0]}"><span class="pf" style="background:${p[1]}">${p[2]}</span>${p[0]}</button>`).join("")}
      </div></section>`;
    appEl.querySelectorAll(".profile").forEach(b => b.addEventListener("click", () => { profile = b.dataset.name; renderFlix(); }));
  } else {
    const f = byId(FEATURED);
    appEl.innerHTML = topBar(true) + `
      <section class="hero" data-anchor="0">${art(f, true)}<div class="hero-shade"></div>
        <div class="hero-body">
          <div class="greet">Welcome, ${profile}</div>
          <div class="kicker"><b>Y</b> Series</div>
          <h2>${f.title}</h2>
          <div class="meta"><span>${f.year}</span><span>${f.networkFull}</span><span>${f.eps}</span><span class="hd">HD</span></div>
          <div class="award">${ICON_TROPHY}${f.award}</div>
          <p>${f.desc}</p>
          <div class="btns"><button class="btn-play" data-play="${f.id}">${ICON_PLAY}Play Trailer</button><button class="btn-info" data-show="${f.id}">${ICON_INFO}More Info</button></div>
        </div></section>
      <div class="stats">${STATS.map(s => `<div class="stat"><b>${s[0]}</b>${s[1]}</div>`).join("")}</div>
      ${ROWS.map((r,i) => `<section class="row" data-anchor="${i+1}"><h3>${r.title}</h3><div class="rail">${r.ids.map(card).join("")}</div></section>`).join("")}
      <footer class="flix-foot">Every title on YorkFlix is a real project York Chen worked on. Episode counts and awards are listed on each show.</footer>`;
  }
  appEl.scrollTop = 0;
  $("#flixClose").addEventListener("click", closeFlix);
  appEl.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => {
    const el = appEl.querySelector(`[data-anchor="${b.dataset.jump}"]`);
    if (el) appEl.scrollTo({ top: b.dataset.jump === "0" ? 0 : el.offsetTop - 70, behavior:"smooth" });
  }));
  wireCards(appEl);
}
function card(id){ const s = byId(id); return `<button class="card" data-show="${id}" aria-label="${s.title}">${art(s)}</button>`; }
function wireCards(root){
  root.querySelectorAll("[data-show]").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.show)));
  root.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => openPlayer(b.dataset.play)));
}

function openDetail(id){
  document.querySelector(".modal-wrap")?.remove();
  const s = byId(id);
  const more = SHOWS.filter(x => x.id !== id).sort((x,y) => (y.network===s.network) - (x.network===s.network)).slice(0,3);
  const wrap = document.createElement("div");
  wrap.className = "modal-wrap";
  wrap.innerHTML = `<div class="modal" role="dialog" aria-label="${s.title}">
    <div class="m-banner">${art(s, true)}<div class="shade"></div>
      <button class="m-close" aria-label="Close">×</button>
      <div class="m-head"><div class="kicker"><b>Y</b> ${s.season}</div><h2>${s.title}</h2>
        <div class="btns"><button class="btn-play" data-play="${s.id}">${ICON_PLAY}Play Trailer</button></div></div>
    </div>
    <div class="m-body">
      <div>
        <div class="meta"><span>${s.year}</span><span>${s.eps}</span><span class="hd">HD</span></div>
        ${s.award ? `<div class="award">${ICON_TROPHY}${s.award}</div>` : ""}
        <p>${s.desc}</p>
        <h4>What I did</h4><ul>${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
        ${s.episodes ? `<h4>${s.epTitle}</h4><div class="eps">${s.episodes.map((e,i) => `<div class="ep"><b>${i+1}</b><span>${e}</span></div>`).join("")}</div>` : ""}
      </div>
      <aside class="m-side"><dl>
        <div><dt>Role</dt><dd>${s.role}</dd></div>
        <div><dt>Aired on</dt><dd>${s.networkFull}</dd></div>
        <div><dt>Year</dt><dd>${s.year}</dd></div>
        <div><dt>Length</dt><dd>${s.eps}</dd></div>
      </dl></aside>
    </div>
    <div class="m-more"><h4>More like this</h4><div class="more-grid">${more.map(x => card(x.id)).join("")}</div></div>
  </div>`;
  wrap.addEventListener("click", e => { if (e.target === wrap) closeDetail(); });
  wrap.querySelector(".m-close").addEventListener("click", closeDetail);
  $("#layer").append(wrap);
  wireCards(wrap);
  wrap.querySelector(".m-close").focus();
  showTip();
}
function closeDetail(){ document.querySelector(".modal-wrap")?.remove(); showTip(); }

function openPlayer(id){
  const s = byId(id);
  const p = document.createElement("div");
  p.className = "player";
  let media;
  if (/\.mp4$/i.test(s.trailer)) media = `<video src="${s.trailer}" controls autoplay playsinline></video>`;
  else if (s.trailer) media = `<iframe src="https://www.youtube-nocookie.com/embed/${s.trailer}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${s.title} trailer"></iframe>`;
  else media = `<div class="soon-trailer">${art(s, true)}<div class="veil"></div><div class="msg"><h3>${s.title}</h3><p>Trailer coming soon</p></div><div class="scrub"><i></i></div></div>`;
  p.innerHTML = `<div class="player-top"><button aria-label="Back">${ICON_BACK}Back</button><span>${s.title} · Trailer</span></div>
    <div class="player-stage"><div class="screen16">${media}</div></div>`;
  p.querySelector("button").addEventListener("click", closePlayer);
  $("#layer").append(p);
  presenter.classList.add("away");
  showTip();
  p.querySelector("button").focus();
}
function closePlayer(){ document.querySelector(".player")?.remove(); presenter.classList.remove("away"); showTip(); }

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".player")) return closePlayer();
  if (document.querySelector(".modal-wrap")) return closeDetail();
  const sheet = document.querySelector(".sheet-wrap .pill-btn"); if (sheet) return sheet.click();
  if (appOpen) return closeFlix();
});
</script>
</body>
