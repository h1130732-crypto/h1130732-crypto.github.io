<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jekyll &amp; Hyde Vocab Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4eee1; --well:#fffcf4; --cell:#f9f3e6; --edge:#d9cdb3;
  --ink:#232c45; --dim:#857b69; --gold:#a8854a; --navy:#243253; --paper:#f7f1e4;
  --ok-b:#e3eee4; --ok-d:#4a7a5c; --ok-t:#25503a;
  --no-b:#f4e1e0; --no-d:#9a3f4a; --no-t:#6b2230;
  --serif:'EB Garamond','Noto Serif TC',Georgia,'Times New Roman',serif;
  --disp:'Cormorant Garamond','Noto Serif TC',Georgia,serif;
  --cjk:'Noto Serif TC','Songti TC','PMingLiU',serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;height:100%;overflow:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;text-align:center;
  background-image:radial-gradient(ellipse at 50% 0%,#fbf7ee 0%,transparent 70%),radial-gradient(ellipse at 50% 100%,#ece3cf 0%,transparent 60%)}
.hidden{display:none!important}
#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
header{padding:16px 12px 0}
header::after{content:"";display:block;width:160px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-family:var(--disp);font-size:clamp(28px,5.4vw,40px);font-weight:600;letter-spacing:1px;color:var(--navy);font-style:italic}
.sub{font-size:12px;color:var(--gold);margin-top:2px;letter-spacing:6px;font-weight:500}
main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto;padding:12px 16px 16px}
footer{flex:none;padding:12px;text-align:center;font-family:var(--cjk);font-size:clamp(16px,min(2.2vw,3.2vh),26px);color:var(--navy);border-top:1px solid var(--gold);background:#efe7d4;letter-spacing:2px}

/* double-ruled frames */
.panel,.card{background:var(--well);border:1px solid var(--edge);box-shadow:inset 0 0 0 4px var(--well),inset 0 0 0 5px #e6dcc4}
.panel{padding:18px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--gold);margin-bottom:12px;display:block;letter-spacing:5px;font-weight:600}

.chaps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;justify-content:center}
.chap{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 4px;cursor:pointer;user-select:none;white-space:nowrap;
  font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--edge)}
.chap input{position:absolute;opacity:0;pointer-events:none}
.chap .cb{width:17px;height:17px;flex:none;border:1.5px solid var(--navy);background:var(--well);position:relative}
.chap:has(input:checked) .cb{background:var(--gold);border-color:var(--gold)}
.chap:has(input:checked) .cb::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chap small{font-size:12px;opacity:.65}
.chap:has(input:checked){color:var(--paper);background:var(--navy);border-color:var(--navy)}
.chap:hover{border-color:var(--gold)}
.chap:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.tools{display:flex;gap:20px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--navy);font-family:var(--serif);font-size:15px;cursor:pointer;padding:4px 2px;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.link:hover{color:var(--gold)}
#count{font-size:15px;color:var(--dim);font-style:italic}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.modes{grid-template-columns:1fr 1fr}}
.mode{padding:12px 10px;text-align:center;cursor:pointer;font-family:var(--serif);font-size:15px;color:var(--dim);background:var(--paper);border:1px solid var(--edge);line-height:1.4;display:flex;flex-direction:column;justify-content:center}
.mode b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;margin-bottom:4px;color:var(--navy)}
.mode:hover{border-color:var(--gold)}
.mode.sel{background:var(--navy);border-color:var(--navy);color:#d9d2bf}
.mode.sel b{color:var(--paper)}

.btn{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:12px 26px;cursor:pointer;color:var(--paper);background:var(--navy);border:1px solid var(--navy);box-shadow:inset 0 0 0 2px var(--navy),inset 0 0 0 3px rgba(168,133,74,.7)}
.btn:hover:not(:disabled){background:#33446d}
.btn:disabled{background:transparent;border-color:var(--edge);color:#b8ad96;box-shadow:none;cursor:not-allowed}
.btn.alt{background:var(--paper);color:var(--navy);border-color:var(--gold);box-shadow:none}
.btn.alt:hover:not(:disabled){background:#efe6d2}
.start{width:100%;padding:14px;font-size:18px;letter-spacing:6px}

.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--dim);margin-bottom:10px;font-style:italic}
.hud b{font-weight:600;color:var(--navy);font-style:normal}
.bar{display:flex;gap:0;height:3px;margin-bottom:12px;background:var(--edge)}
.bar i{flex:1;background:transparent}
.bar i.on{background:var(--gold)}

.card{padding:20px 22px;min-height:140px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;margin-bottom:12px}
.q{font-size:12px;color:var(--gold);letter-spacing:5px;font-weight:600}
.def{font-size:clamp(24px,4.8vw,32px);line-height:1.4;max-width:600px;color:var(--ink)}
.zh{font-family:var(--cjk);font-size:20px;color:#7a4b2a;padding-top:14px;border-top:1px solid var(--edge);width:100%;max-width:560px}
.zh.cover{color:var(--dim);font-size:14px;cursor:pointer;font-family:var(--serif);font-style:italic}
#qcard{cursor:pointer;flex:1 1 0}
.pat{font-family:var(--disp);font-size:22px;letter-spacing:6px;color:var(--dim);word-break:break-all;font-weight:600}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.choices,.modes{grid-template-columns:1fr}}
.ch{padding:24px 12px;cursor:pointer;text-align:center;font-family:var(--serif);font-size:22px;color:var(--ink);background:var(--well);border:1px solid var(--edge)}
.ch i{font-style:italic;font-size:15px;margin-right:12px;color:var(--gold)}
.ch:hover:not(:disabled){border-color:var(--gold);background:#fffaf0}
.ch:disabled{cursor:default}
.ch.sel,.chip.sel{border-color:var(--navy);background:#eef0f7;box-shadow:inset 0 0 0 1px var(--navy)}
.ch.dim{opacity:.4}
.ch.ok{background:var(--ok-b);border-color:var(--ok-d);color:var(--ok-t);box-shadow:inset 0 0 0 1px var(--ok-d)}
.ch.bad{background:var(--no-b);border-color:var(--no-d);color:var(--no-t);box-shadow:inset 0 0 0 1px var(--no-d)}

.typein{display:flex;gap:10px}
.typein input{flex:1;min-width:0;text-align:center;background:var(--well);border:1px solid var(--gold);color:var(--ink);padding:12px;font-family:var(--serif);font-size:24px;outline:none}
.typein input:focus{box-shadow:0 0 0 2px rgba(168,133,74,.3)}
.typein input.ok{border-color:var(--ok-d);color:var(--ok-t);background:var(--ok-b)} .typein input.bad{border-color:var(--no-d);color:var(--no-t);background:var(--no-b)}

.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-height:160px;overflow:auto;scrollbar-width:thin;scrollbar-color:#c9bb9b var(--cell);padding:12px;background:var(--cell);border:1px solid var(--edge)}
.chip{padding:4px 12px;cursor:pointer;font-family:var(--serif);font-size:17px;color:var(--ink);background:var(--well);border:1px solid var(--edge)}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.used{background:transparent;border-color:transparent;color:#c2b8a2;text-decoration:line-through;cursor:default}
.chip.bad{background:var(--no-b);border-color:var(--no-d);color:var(--no-t)}
.chip.ok{background:var(--ok-b);border-color:var(--ok-d);color:var(--ok-t)}

.fb{min-height:48px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-size:16px}
.fb .msg{display:flex;flex-direction:column;align-items:center;gap:2px}
.fb .verdict{font-family:var(--disp);font-size:28px;font-weight:700;font-style:italic}
.fb .good{color:var(--ok-t)} .fb .no{color:var(--no-t)}
.fb .sol{font-size:17px;color:var(--dim)}
.fb .sol b{color:var(--navy);font-size:22px;font-weight:600}
.fb .sol s{color:var(--no-t)}

.fc{flex:1;display:flex;margin-bottom:12px}
.fc .card{flex:1;width:100%;min-height:200px;cursor:pointer;margin-bottom:0}
.fc .word{font-family:var(--disp);font-size:clamp(44px,9vw,80px);font-weight:600;color:var(--navy);font-style:italic}
.fc .hint{font-size:16px;color:var(--gold);letter-spacing:3px}
.fc .back{display:flex;flex-direction:column;align-items:center;gap:22px}
.fc .back .word{font-size:clamp(32px,5.5vw,46px)}
.fc .back .def{font-size:clamp(24px,4.4vw,34px)}
.fc .back .zh{font-size:clamp(22px,4vw,32px);padding-top:20px}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nav .btn{padding:16px 28px;font-size:16px}
.keys{font-size:14px;color:var(--dim);margin-top:16px;font-style:italic}

.score{font-family:var(--disp);font-size:clamp(40px,10vw,64px);font-weight:600;color:var(--navy);margin:6px 0 8px}
.pct{font-size:17px;color:var(--dim);font-style:italic}
.miss{list-style:none;padding:0;display:grid;gap:8px;text-align:left}
.miss li{padding:10px 14px;background:var(--cell);border-left:3px solid var(--gold);font-size:16px;line-height:1.5;color:var(--dim)}
.miss b{display:block;font-size:18px;color:var(--navy);margin-bottom:2px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

main>section:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
#menu .panel{flex:1;display:flex;flex-direction:column;justify-content:center}
#menu .chaps,#menu .modes{align-items:stretch}
#ans{flex:none}
#ans.grow{flex:1.3 1 0;min-height:110px;display:flex;flex-direction:column}
#ans.grow .bank{flex:1;max-height:none;align-content:flex-start}
#app{zoom:1}
@media(max-width:640px){.chaps{gap:5px}.chap{padding:14px 2px;font-size:13px;gap:4px;flex-direction:column}.chap small{display:none}.chap .cb{width:14px;height:14px}}
@media(max-height:760px){.card{min-height:110px}}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--gold);margin:0 4px}
.fill{color:var(--ok-t);border-bottom:2px solid var(--gold);padding:0 4px}
.zh{line-height:1.5}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Jekyll &amp; Hyde</h1>
  <div class="sub">VOCABULARY</div>
</header>

<main>
  <section id="menu">
    <div class="panel">
      <span class="lbl">1 · CHAPTERS</span>
      <div class="chaps" id="chaps"></div>
      <div class="tools">
        <button class="link" id="allBtn">Select all</button>
        <button class="link" id="noneBtn">Clear</button>
        <span id="count"></span>
      </div>
    </div>
    <div class="panel">
      <span class="lbl">2 · MODE</span>
      <div class="modes" id="modes">
        <button class="mode sel" data-m="mc"><b>Multiple choice</b><span>Pick 1 of 4</span></button>
        <button class="mode" data-m="type"><b>Type it</b><span>Type the word</span></button>
        <button class="mode" data-m="sent"><b>Fill the blank</b><span>Easy sentence with a missing word; pick 1 of 4</span></button>
        <button class="mode" data-m="flash"><b>Flash cards</b><span>Flip through, no score</span></button>
      </div>
    </div>
    <button class="btn start" id="startBtn">START</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="hud"><span>Q <b id="qn">1</b>/<b id="qt">0</b></span><span>Score <b id="sc">0</b></span><span>Combo <b id="st">0</b></span><button class="link" id="quitBtn">Quit</button></div>
    <div class="bar" id="bar"></div>
    <div class="card" id="qcard">
      <div class="q" id="qlab">WHICH WORD?</div>
      <div class="def" id="qdef"></div>
      <div class="pat hidden" id="qpat"></div>
      <div class="zh cover" id="qzh"></div>
    </div>
    <div id="ans"></div>
    <div class="fb" id="fb"></div>
  </section>

  <section id="flash" class="hidden">
    <div class="hud"><span>Card <b id="fn">1</b>/<b id="ft">0</b></span><button class="link" id="fquit">Quit</button></div>
    <div class="fc"><div class="card" id="fcard"></div></div>
    <div class="nav">
      <button class="btn alt" id="fprev">◀ Prev</button>
      <button class="btn alt" id="fshuf">Shuffle</button>
      <button class="btn" id="fnext">Next ▶</button>
    </div>
    <p class="keys">Click card to flip · ← → to move · Space to flip</p>
  </section>

  <section id="result" class="hidden">
    <div class="panel center">
      <span class="lbl" id="rTitle">GAME OVER</span>
      <div class="score" id="rScore"></div>
      <div class="pct" id="rSub"></div>
    </div>
    <div class="panel" id="missBox">
      <span class="lbl">MISSED</span>
      <ul class="miss" id="missList"></ul>
    </div>
    <div class="row">
      <button class="btn alt" id="retryMiss">Retry missed</button>
      <button class="btn alt" id="again">Play again</button>
      <button class="btn alt" id="home">Menu</button>
    </div>
  </section>
</main>
</div>

<footer>感謝José的大恩大德</footer>

<script>

};
const ORDER = ["1-2","3-4","5-7","8","9","10"];
const CH_LABEL = {"1-2":"CH 1-2","3-4":"CH 3-4","5-7":"CH 5-7","8":"CH 8","9":"CH 9","10":"CH 10"};
const $ = id => document.getElementById(id);
const PAL = [
 {b:'#0f2f34',d:'#1d5a63',t:'#8fc7cf'}, // I
 {b:'#322f0f',d:'#5e5a1c',t:'#cfc77a'}, // O
 {b:'#271640',d:'#47296b',t:'#b79ad6'}, // T
 {b:'#0f3017',d:'#1d5a2c',t:'#86c496'}, // S
 {b:'#3a1414',d:'#662323',t:'#d99090'}, // Z
 {b:'#15204a',d:'#26397d',t:'#93a6e8'}, // J
 {b:'#3a220d',d:'#6b4018',t:'#dcae82'}  // L
];
const tint = (el,i) => { return;  const p=PAL[i%PAL.length]; el.style.setProperty('--b',p.b); el.style.setProperty('--d',p.d); el.style.setProperty('--t',p.t); };

const DATA = {};
for (const k of ORDER) DATA[k] = RAW[k].split('\n').map(l => { const [w,e,z,sn] = l.split('|'); return {w, e, z, sn, ch:k, ok: answers(w)}; });
function answers(w){
  const out = new Set();
  w.split('/').map(s=>s.trim()).forEach(p=>{ out.add(norm(p.replace(/\[.*?\]/g,''))); out.add(norm(p.replace(/[\[\]]/g,''))); });
  return [...out];
}
function norm(s){ return s.toLowerCase().replace(/[-\s]+/g,' ').trim(); }
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const show = id => ['menu','quiz','flash','result'].forEach(s => $(s).classList.toggle('hidden', s!==id));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let mode = 'mc';
let S = {};

/* ---- menu ---- */
const chapsEl = $('chaps');
ORDER.forEach((k,i) => {
  const l = document.createElement('label'); l.className = 'chap'; tint(l,i);
  l.innerHTML = `<input type="checkbox" value="${k}"><span class="cb"></span><span>${CH_LABEL[k]}</span><small>${DATA[k].length}</small>`;
  chapsEl.appendChild(l);
});
const checked = () => [...chapsEl.querySelectorAll('input:checked')].map(i=>i.value);
function scopeWords(){
  const seen = new Set(), out = [];
  checked().forEach(k => DATA[k].forEach(x => { const id = norm(x.w); if(!seen.has(id)){seen.add(id); out.push(x);} }));
  return out;
}
function refresh(){
  const n = scopeWords().length;
  $('count').textContent = n + ' words';
  $('startBtn').disabled = n < 1 || ((mode==='mc'||mode==='sent') && n < 4);
}
chapsEl.addEventListener('change', refresh);
$('allBtn').onclick = () => { chapsEl.querySelectorAll('input').forEach(i=>i.checked=true); refresh(); };
$('noneBtn').onclick = () => { chapsEl.querySelectorAll('input').forEach(i=>i.checked=false); refresh(); };
$('modes').addEventListener('click', e => {
  const b = e.target.closest('.mode'); if(!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('sel', x===b));
  refresh();
});
$('startBtn').onclick = () => start(scopeWords());
$('quitBtn').onclick = $('fquit').onclick = $('home').onclick = () => { clearTimeout(S.timer); show('menu'); refresh(); };
$('again').onclick = () => start(S.pool);
$('retryMiss').onclick = () => start(S.missed);
refresh();

function start(pool){
  S = {pool, items: shuffle(pool), i:0, score:0, streak:0, missed:[], locked:false, used:new Set()};
  if(mode==='flash') return startFlash();
  $('qt').textContent = S.items.length;
  $('bar').innerHTML = S.items.length > 40 ? '' : S.items.map(()=>'<i></i>').join('');
  show('quiz'); renderQ();
}

/* ---- quiz ---- */
function renderQ(){
  const q = S.items[S.i]; S.locked = false; S.cur = q;
  $('qn').textContent = S.i+1; $('sc').textContent = S.score; $('st').textContent = S.streak;
  const cells = $('bar').children;
  if(cells.length){ for(let k=0;k<cells.length;k++){ cells[k].classList.toggle('on', k<S.i); tint(cells[k],k); } }
  else $('bar').innerHTML = `<i class="on" style="flex:none;width:${S.i/S.items.length*100}%"></i>`;
  if(mode==='sent') $('qdef').innerHTML = esc(q.sn).replace('___','<span class="blank"></span>'); else $('qdef').textContent = q.e;
  $('qlab').textContent = mode==='sent' ? 'FILL THE BLANK' : 'WHICH WORD?';
  const zh=$('qzh'); zh.className='zh cover'; zh.textContent = mode==='sent' ? '▸ Click for a hint' : '▸ Click to reveal Chinese';
  const pat = $('qpat'); pat.style.color='';
  pat.classList.toggle('hidden', mode!=='type');
  if(mode==='type') pat.textContent = q.w.replace(/\[.*?\]/g,'').split(' / ')[0].split('').map(c=>/[a-z]/i.test(c)?'_':c).join(' ');
  S.sel = null;
  $('fb').innerHTML = '<button class="btn" id="sub" disabled>Submit</button>';
  $('sub').onclick = submitAnswer;
  const a = $('ans'); a.innerHTML = '';
  if(mode==='mc'||mode==='sent'){
    const wrap = document.createElement('div'); wrap.className='choices';
    const others = shuffle(S.pool.filter(x=>x!==q)).slice(0,3);
    shuffle([q,...others]).forEach((o,idx)=>{
      const b = document.createElement('button'); b.className='ch';
      b.innerHTML = `<i>${'ABCD'[idx]}</i>${esc(o.w)}`;
      b.onclick = () => select(b, o===q);
      tint(b,idx); b.dataset.right = o===q ? '1':'';
      wrap.appendChild(b);
    });
    a.appendChild(wrap);
  } else if(mode==='type'){
    a.innerHTML = `<div class="typein"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here"></div>`;
    const inp = $('inp'); inp.focus();
    inp.oninput = () => { $('sub').disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if(e.key==='Enter') submitAnswer(); };
  }
}
function hintHTML(q){ return mode==='sent' ? esc(q.e)+'<br>'+esc(q.z) : esc(q.z); }
$('qcard').onclick = () => { if(!S.cur) return; const zh=$('qzh'); zh.className='zh'; zh.innerHTML=hintHTML(S.cur); };
function select(el, ok){
  if(S.locked) return;
  document.querySelectorAll('.ch.sel').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel'); S.sel = {el, ok}; $('sub').disabled = false;
}
function submitAnswer(){
  if(S.locked) return;
  if(mode==='type'){
    const inp=$('inp'); if(!inp.value.trim()) return;
    const ok = S.cur.ok.includes(norm(inp.value)); inp.classList.add(ok?'ok':'bad'); answer(ok);
  } else if(S.sel){ answer(S.sel.ok, S.sel.el); }
}
function answer(ok, el){
  if(S.locked) return; S.locked = true;
  document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
  const q = S.cur;
  const zh=$('qzh'); zh.className='zh'; zh.innerHTML=hintHTML(q);
  if(mode==='sent'){ const w=q.w.split('/')[0].trim().replace(/\[.*?\]/g,''); const atStart=q.sn.startsWith('___'); const shown=atStart? w[0].toUpperCase()+w.slice(1) : w[0].toLowerCase()+w.slice(1); $('qdef').innerHTML = esc(q.sn).replace('___','<b class="fill">'+esc(shown)+'</b>'); }
  if(ok){ S.score++; S.streak++; } else { S.streak=0; S.missed.push(q); }
  $('sc').textContent=S.score; $('st').textContent=S.streak;
  if(mode==='mc'||mode==='sent'){
    document.querySelectorAll('.ch').forEach(b=>{ b.disabled=true; if(b.dataset.right) b.classList.add('ok'); else if(b!==el) b.classList.add('dim'); });
    if(!ok) el.classList.add('bad');
  } else { const i=$('inp'); if(i) i.disabled=true; }
  const last = S.i === S.items.length-1;
  const typed = mode==='type' && $('inp') ? $('inp').value.trim() : '';
  const msg = ok
    ? `<div class="verdict good">✔ Correct!</div><div class="sol">Answer: <b>${esc(q.w)}</b></div>`
    : `<div class="verdict no">✘ Wrong</div>${typed?`<div class="sol">You typed: <s>${esc(typed)}</s></div>`:''}<div class="sol">Correct answer: <b>${esc(q.w)}</b></div>`;
  $('fb').innerHTML = `<div class="msg">${msg}</div><button class="btn" id="nx">${last?'Finish':'Next'} ▶</button>`;
  if(mode==='type'){ const p=$('qpat'); p.textContent=q.w; p.style.color = ok?'var(--ok-t)':'var(--no-t)'; }
  $('nx').onclick = next; $('nx').focus();
}
function next(){
  clearTimeout(S.timer);
  if(!S.locked) return;
  S.i++;
  if(S.i >= S.items.length) return finish();
  renderQ();
}
function finish(){
  const n=S.items.length, pct=Math.round(S.score/n*100);
  $('rTitle').textContent = pct>=80 ? 'STAGE CLEAR' : 'GAME OVER';
  $('rScore').textContent = `${S.score}/${n}`;
  $('rSub').textContent = `${pct}% correct`;
  $('missBox').classList.toggle('hidden', !S.missed.length);
  $('retryMiss').classList.toggle('hidden', !S.missed.length);
  $('missList').innerHTML = S.missed.map(m=>`<li><b>${esc(m.w)} · ${esc(m.z)}</b>${esc(m.e)}</li>`).join('');
  show('result');
}

/* ---- flash cards ---- */
function startFlash(){ S.fi=0; S.flip=false; S.items=shuffle(S.pool); show('flash'); renderF(); }
function renderF(){
  const c = S.items[S.fi];
  $('fn').textContent=S.fi+1; $('ft').textContent=S.items.length;
  $('fcard').innerHTML = S.flip
    ? `<div class="back"><div class="word">${esc(c.w)}</div><div class="def">${esc(c.e)}</div><div class="zh">${esc(c.z)}</div></div>`
    : `<div class="word">${esc(c.w)}</div><div class="hint">CLICK TO FLIP</div>`;
}
const flip = () => { S.flip=!S.flip; renderF(); };
const fmove = d => { S.fi=(S.fi+d+S.items.length)%S.items.length; S.flip=false; renderF(); };
$('fcard').onclick = flip;
$('fnext').onclick = () => fmove(1);
$('fprev').onclick = () => fmove(-1);
$('fshuf').onclick = () => { S.items=shuffle(S.items); S.fi=0; S.flip=false; renderF(); };
document.addEventListener('keydown', e => {
  if(!$('flash').classList.contains('hidden')){
    if(e.key==='ArrowRight') fmove(1);
    else if(e.key==='ArrowLeft') fmove(-1);
    else if(e.key===' '){ e.preventDefault(); flip(); }
  } else if(!$('quiz').classList.contains('hidden') && e.key==='Enter' && document.activeElement.tagName!=='BUTTON' && document.activeElement.tagName!=='INPUT'){
    if(S.locked) next(); else submitAnswer();
  }
});

/* scale the whole UI to the window so it's big but never needs scrolling */
function fit(){
  const f = document.querySelector('footer').offsetHeight;
  const z = Math.max(1, Math.min((innerHeight - f) / 725, innerWidth / 640, 1.9));
  $('app').style.zoom = z.toFixed(3);
}
addEventListener('resize', fit); fit();
</script>
</body>
